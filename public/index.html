function latestFilingHighlights(ctx){
  const m = ctx.m, L = m.latest, P = m.prior, c = ctx.c;
  const out = [];
  out.push(`Revenue of ${fmt.money(L.rev)} for FY${L.fy}${P ? `, ${fmt.pctSigned(m.revGrowth)} against ${fmt.money(P.rev)} in FY${P.fy}` : ""}.`);
  if(!m.isBank) out.push(`Operating income of ${fmt.money(L.opInc)} on an operating margin of ${fmt.pct(m.opMargin)}${m.opMarginDelta != null ? ` (${fmt.ptsSigned(m.opMarginDelta,1)} year over year)` : ""}.`);
  out.push(`Net income of ${fmt.money(L.ni)} and diluted EPS of $${(L.eps??0).toFixed(2)}.`);
  if(!m.isBank){
    out.push(`Capital expenditure of ${fmt.money(L.capex)}, ${fmt.pct(m.capexIntensity)} of revenue, against operating cash flow of ${fmt.money(L.ocf)}.`);
    out.push(`Liquidity: ${fmt.money(L.cash)} of cash and equivalents against ${fmt.money(L.debt)} of total debt, a current ratio of ${fmt.x(m.currentRatio,2)}.`);
  } else {
    out.push(`Provision for credit losses of ${fmt.money(L.provision)} and non-interest expense of ${fmt.money(L.expense)}.`);
    out.push(`Total assets of ${fmt.money(L.ta)} funded by ${fmt.money(L.deposits)} of deposits, with ${fmt.money(L.eq)} of common equity.`);
  }
  if(c.concentration) out.push(`Concentration disclosed in the dataset: ${c.concentration}`);
  return out;
}

async function enhanceSummary(){
  const btn = $("#enhanceBtn"), grid = $("#anGrid"), prov = $("#aiProv");
  if(!btn) return;
  btn.disabled = true; btn.textContent = "Thinking…";
  if(prov) prov.textContent = "Claude is writing…";
  try{
    const j = await aiService.enhance(state.ctx, "summary");
    const map = {performance:"Performance", growth:"Growth", profitability:"Profitability", position:"Financial Position", outlook:"Outlook", concern:"Key Concern"};
    state.aiSummary = {
      performance:j.performance, growth:j.growth, profitability:j.profitability,
      position:j.position, outlook:j.outlook, concern:j.concern
    };
    grid.innerHTML = Object.keys(map).map(k =>
      `<div class="an-block ${k==="concern"?"warn":""}"><h5>${map[k]}</h5><p>${esc(state.aiSummary[k] || "—")}</p></div>`).join("");
    if(prov) prov.textContent = "Written by Claude from the computed metrics";
    btn.textContent = "Rewritten ✓";
  }catch(e){
    if(prov) prov.textContent = "Deterministic engine";
    btn.textContent = "Rewrite with Claude";
    btn.disabled = false;
    if(e && (e.code === "not_granted" || e.code === "sampling_disabled" || e.code === "not_declared")){
      btn.classList.add("hide");
    } else {
      alert("Claude could not complete that request (" + (e?.code || "error") + "). The deterministic summary above is unchanged.");
    }
  }
}

      ["Net income", y => money(y.ni), "total"],
      ["Diluted EPS ($)", y => y.eps == null ? "—" : y.eps.toFixed(2)]
    ] : [
      ["Revenue", y => money(y.rev), "total"],
      ["Cost of revenue", y => money(y.gp == null ? null : -(y.rev - y.gp)), "sub", true],
      ["Gross profit", y => money(y.gp), "total"],
      ["Gross margin", y => fmt.pct(y.grossMargin), "sub"],
      ["Operating expenses", y => money(y.gp == null || y.opInc == null ? null : -(y.gp - y.opInc)), "sub", true],
      ["Operating income", y => money(y.opInc), "total"],
      ["Operating margin", y => fmt.pct(y.opMargin), "sub"],
      ["Depreciation & amortisation", y => money(y.da), "sub"],
      ["EBITDA", y => money(y.ebitda), "total"],
      ["Net income", y => money(y.ni), "total"],
      ["Net margin", y => fmt.pct(y.netMargin), "sub"],

    ] : [

      ["Inventory", y => money(y.inv)],
      ["Total current assets", y => money(y.ca), "total"],
      ["Total assets", y => money(y.ta), "total"],
      ["Total current liabilities", y => money(y.cl), "total"],
      ["Total debt", y => money(y.debt)],
      ["Total liabilities", y => money(y.ta == null || y.eq == null ? null : y.ta - y.eq), "total"],
      ["Shareholders' equity", y => money(y.eq), "total"],
      ["Net debt / (net cash)", y => money(y.netDebt), "sub"],
      ["Working capital", y => money(y.ca == null || y.cl == null ? null : y.ca - y.cl), "sub"],

      ["Share repurchases", y => money(y.bb == null ? null : -y.bb), "", true]

}

function compsInterpretation(ctx){
  const m = ctx.m, cp = m.comps, c = ctx.c;
  if(cp.isBank){
    const p = cp.premium.pe;
    return `${esc(c.ticker)} trades at ${fmt.x(m.pe,1)} earnings versus a peer median of ${fmt.x(cp.median.pe,1)}, a ${fmt.pctSigned(p,0)} ${p>0?"premium":"discount"}, and at ${fmt.x(m.ptbv,2)} tangible book. Return on equity of ${fmt.pct(m.roe)} against a peer median of ${fmt.pct(cp.median.roe)} is the variable that has to justify that gap — for banks, price to book and ROE are mechanically linked, so a bank earning above-median returns should trade above median book value.`;
  }
  const pr = cp.premium.evEbitda, gr = cp.premium.growth, mr = cp.premium.ebitdaMargin;
  const dir = pr == null ? "in line with" : pr > 0.05 ? "at a premium to" : pr < -0.05 ? "at a discount to" : "in line with";
  return `${esc(c.ticker)} trades at ${fmt.x(m.evEbitda)} EV/EBITDA and ${fmt.x(m.evRev)} EV/Revenue, ${dir} the peer median of ${fmt.x(cp.median.evEbitda)} and ${fmt.x(cp.median.evRev)} — ${fmt.pctSigned(pr,0)} on EBITDA. `
   + `Revenue growth of ${fmt.pctSigned(m.revGrowth)} compares with a peer median of ${fmt.pct(cp.median.growth)} (${fmt.pctSigned(gr,0)}) and an EBITDA margin of ${fmt.pct(m.ebitdaMargin)} against ${fmt.pct(cp.median.ebitdaMargin)} (${fmt.pctSigned(mr,0)}). `
   + (pr != null && pr > 0.15
      ? (gr != null && gr > 0.15
         ? `A premium of this size is at least internally consistent: the company is growing materially faster than the group, and multiple and growth generally move together. The question for the committee is whether the growth gap persists long enough to earn back the premium, because convergence to the median multiple alone would cost roughly ${fmt.pct(Math.abs(pr/(1+pr)),0)} of the current price.`
         : `The premium is not currently supported by faster growth, which makes it a weaker starting point — the multiple is carrying more of the return than the fundamentals are.`)
      : pr != null && pr < -0.15
        ? (gr != null && gr > 0 ? `A discount alongside above-median growth is the more interesting setup, and the first thing to test is whether the market is pricing a risk the screened metrics do not capture — customer concentration, an accounting difference, or a peer set that is not truly comparable.`
                                : `The discount is consistent with slower growth than the group; relative cheapness here is explained rather than anomalous.`)
        : `Trading close to the peer median means relative value is not doing the work in this thesis — the case has to rest on the operating trajectory and the intrinsic-value model rather than on multiple re-rating.`);
}

/* ---------------- DCF ---------------- */

      <p style="font-size:13.5px;line-height:1.75;margin:0 0 10px">

function dcfOutputHTML(){

  }
  const waccs = [a.wacc-0.01, a.wacc-0.005, a.wacc, a.wacc+0.005, a.wacc+0.01];
  const tgrs  = [a.tgr+0.01, a.tgr+0.005, a.tgr, a.tgr-0.005, a.tgr-0.01];
  const grid = fin.sensitivity(a, waccs, tgrs);
  const flat = grid.flat().filter(v => v != null && isFinite(v));

  const heat = v => {
    if(v == null || !isFinite(v)) return "";
    const rel = (v - c.price) / c.price;
    const t = clamp(rel / 0.4, -1, 1);
    return t > 0 ? `background:color-mix(in srgb, var(--pos) ${Math.round(t*22)}%, transparent)`

  <div class="out-grid" style="margin-bottom:14px">

        <tr class="sub"><td class="rowlabel muted">EBIT margin %</td>${d.rows.map(r => `<td class="v">${fmt.pct(r.margin)}</td>`).join("")}<td class="v faint">—</td></tr>
        <tr><td class="rowlabel">EBIT</td>${d.rows.map(r => `<td class="v">${fmt.plain(r.ebit,0)}</td>`).join("")}<td class="v faint">—</td></tr>
        <tr class="sub"><td class="rowlabel muted">Less: tax at ${fmt.pct(a.tax,0)}</td>${d.rows.map(r => `<td class="v neg">${fmt.plain(-(r.ebit-r.nopat),0)}</td>`).join("")}<td class="v faint">—</td></tr>

        <tr class="sub"><td class="rowlabel muted">Less: capex</td>${d.rows.map(r => `<td class="v neg">${fmt.plain(-r.capex,0)}</td>`).join("")}<td class="v faint">—</td></tr>
        <tr class="sub"><td class="rowlabel muted">Less: increase in NWC</td>${d.rows.map(r => `<td class="v ${r.dNwc>0?"neg":""}">${fmt.plain(-r.dNwc,0)}</td>`).join("")}<td class="v faint">—</td></tr>
        <tr class="total"><td class="rowlabel">Unlevered free cash flow</td>${d.rows.map(r => `<td class="v">${fmt.plain(r.ufcf,0)}</td>`).join("")}<td class="v">${fmt.plain(d.terminalValue,0)}</td></tr>
        <tr class="sub"><td class="rowlabel muted">Discount factor${a.midYear?" (mid-year)":""}</td>${d.rows.map(r => `<td class="v">${r.df.toFixed(3)}</td>`).join("")}<td class="v">${fin.discountFactor(a.wacc, d.rows.length, a.midYear).toFixed(3)}</td></tr>
        <tr class="total"><td class="rowlabel">Present value</td>${d.rows.map(r => `<td class="v">${fmt.plain(r.pv,0)}</td>`).join("")}<td class="v">${fmt.plain(d.pvTerminalValue,0)}</td></tr>
      </tbody>
    </table>
  </div>

  ${d.upside != null && d.upside < -0.55 ? `

    <p style="margin:0;font-size:12.5px;line-height:1.7;color:var(--dim)">
      A conventional unlevered DCF cannot support the current price of ${fmt.price(m.price)} on these assumptions — the model returns ${fmt.price(d.impliedPrice)}. Rather than tune the inputs backwards until the output matches the market, the model is left as built and the gap is reported as the finding. A gap this wide usually means one of three things: the market is discounting cash flows the five-year forecast does not contain (new segments, optionality, a step-change in margin), the market is applying a lower risk premium than the ${fmt.pct(a.wacc)} WACC used here, or the market is wrong. The sensitivity grid below shows what discount rate and terminal growth would be required to close the gap — that is the honest way to frame the disagreement.

          <tr><td class="rowlabel">Implied terminal FCF multiple</td><td class="v">${fmt.x(d.impliedExitMultiple,1)}</td></tr>

        ${d.terminalShare > 0.8
          ? "Over 80% of enterprise value sits in the terminal value. That is common for a growth business but means the output is really a statement about the terminal assumptions, not the five-year forecast — weight the sensitivity grid accordingly."
          : "Terminal value is a reasonable share of enterprise value, so the explicit forecast is doing real work in this valuation."}
      </div>

          ${grid.map((row,i) => `<tr><td class="rowlabel">${fmt.pct(tgrs[i])}</td>${row.map(v => `<td class="c"><span class="heat" style="${heat(v)}">${fmt.price(v)}</span></td>`).join("")}</tr>`).join("")}

      Shaded against the current price of ${fmt.price(c.price)} — green is above, red below. The grid spans ${fmt.price(lo)} to ${fmt.price(hi)} across ±100bps of WACC and terminal growth, which is the honest width of the answer: a DCF is a range, not a point.
    </div>
  </div>`;
}

/* DCF inputs update only the output pane, so focus and cursor
   position survive typing. */
function setDcf(key, val){
  const o = state.dcfOverride, base = state.ctx.c.dcfDefaults;
  if(key === "midYear"){ o.midYear = !!val; }
  else if(key.startsWith("g")){
    const i = +key.slice(1);
    const cur = o.growth ? o.growth.slice() : state.ctx.dcf.assump.growth.slice();
    const n = parseFloat(val);
    cur[i] = Number.isNaN(n) ? cur[i] : n / 100;
    o.growth = cur;
  } else {
    const n = parseFloat(val);
    if(Number.isNaN(n)) return;
    o[key] = n / 100;
  }
  rebuildDCF();
  const host = $("#dcfOut");
  if(host) host.innerHTML = dcfOutputHTML();
}
function resetDcf(){ state.dcfOverride = {}; rebuildDCF(); render(); }
function recalcWacc(){
  const g = k => parseFloat($("#w_"+k)?.value);
  const rf = g("rf")/100, erp = g("erp")/100, beta = g("beta"), kd = g("kd")/100, dw = g("debtWeight")/100;
  const tax = state.ctx.dcf.assump.tax;
  if([rf,erp,beta,kd,dw].some(Number.isNaN)) return;
  const ke = fin.costOfEquity(rf, beta, erp);
  const w = fin.wacc(rf, beta, erp, kd, tax, dw);
  $("#keOut").textContent = fmt.pct(ke, 2);
  $("#waccOut").textContent = fmt.pct(w, 2);
  $("#waccOut").dataset.v = w;
}
function applyWacc(){
  const v = parseFloat($("#waccOut")?.dataset.v);
  if(Number.isNaN(v)) return;
  state.dcfOverride.wacc = v;
  rebuildDCF();
  const wi = $("#waccInput"); if(wi) wi.value = (v*100).toFixed(1);
  const host = $("#dcfOut"); if(host) host.innerHTML = dcfOutputHTML();
}

/* ---------------- scenarios ---------------- */
function scenariosHTML(){
  const ctx = state.ctx, c = ctx.c;
  if(!ctx.scen) return `<div class="panel panel-pad"><p style="margin:0;font-size:13.5px;line-height:1.7">Scenario valuation is driven by the DCF, which is not applied to a bank. See the DCF tab for why, and the comparables tab for the relative-value framework used instead.</p></div>`;
  const keys = ["bear","base","bull"];
  const card = k => {
    const s = ctx.scen[k], r = s.result, a = s.assumptions;
    return `<div class="scen ${k}">
      <h4>${k.toUpperCase()} CASE</h4>
      <div class="val">${fmt.price(r.impliedPrice)}</div>
      <div class="up ${fmt.cls(r.upside)}">${fmt.pctSigned(r.upside,0)} vs. ${fmt.price(c.price)}</div>
      <p>${esc(aiService.generateScenarioExplanation(ctx, k))}</p>
      <div class="scen-assump">
        Growth path ${a.growth.map(g => fmt.pct(g,0)).join(" / ")}<br>
        Terminal EBIT margin ${fmt.pct(a.ebitMarginTarget)}<br>
        WACC ${fmt.pct(a.wacc)} · terminal growth ${fmt.pct(a.tgr)}<br>
        Enterprise value ${fmt.money(r.enterpriseValue)}

  };
  return `
    <div class="grid3" style="margin-bottom:16px">${keys.map(card).join("")}</div>
    <div class="chart-card" style="margin-bottom:14px">
      <div class="chart-head"><span class="chart-title">Implied value per share by scenario</span><span class="chart-sub">dashed line: current price ${fmt.price(c.price)}</span></div>
      <div class="chart-host" id="ch-scen"></div>
    </div>
    <div class="panel panel-pad">
      <div class="subtle-label" style="margin-bottom:9px">How these are built</div>
      <p style="margin:0;font-size:13px;line-height:1.7;color:var(--dim)">
        Each scenario is a set of assumption deltas applied to the same DCF code that produces the base case — growth scaled to roughly ${fmt.pct(0.45,0)} of base in the bear case and ${fmt.pct(1.40,0)} in the bull case, terminal EBIT margin moved ±3.5 points, and the discount rate widened in the bear case to reflect the higher risk premium that outcome would carry. Nothing is written by hand and nothing is asked of a language model. Edit the base assumptions on the DCF tab and all three scenarios move with them.
      </p>
    </div>`;
}

/* ---------------- thesis / risks / scorecard / IC ---------------- */
function analysisHTML(){
  const ctx = state.ctx, m = ctx.m, c = ctx.c, sc = ctx.score, v = ctx.verdict;
  const d = ctx.dcf;
  const th = ctx.thesis, risks = ctx.risks;
  const scoreColor = s => s == null ? "var(--border-2)" : s >= 7.5 ? "var(--pos)" : s >= 5.5 ? "var(--accent)" : s >= 4 ? "var(--warn)" : "var(--neg)";

  return `

    <div class="section-head"><span class="section-title">Investment Thesis</span><span class="section-rule"></span>

    <div class="panel">
      ${th.length ? th.map((t,i) => `

function icStatement(ctx){
  const m = ctx.m, d = ctx.dcf, v = ctx.verdict, c = ctx.c;
  const strong = ctx.score.categories.filter(x=>x.score!=null).sort((a,b)=>b.score-a.score)[0];
  const weak   = ctx.score.categories.filter(x=>x.score!=null).sort((a,b)=>a.score-b.score)[0];
  const val = d ? `the base-case DCF implies ${fmt.price(d.impliedPrice)} against ${fmt.price(c.price)} (${fmt.pctSigned(d.upside,0)})`
                : `relative valuation at ${fmt.x(m.pe,1)} earnings against a ${fmt.x(m.comps.median.pe,1)} peer median`;
  const map = {
    ATTRACTIVE:`The combination of ${strong.name.toLowerCase()} (${fmt.score(strong.score)}/10) and a valuation gap is what drives the stance: ${val}. ${weak.name} remains the weakest input at ${fmt.score(weak.score)}/10 and is the part of the case most likely to be wrong.`,
    WATCH:`The operating case is sound — ${strong.name.toLowerCase()} scores ${fmt.score(strong.score)}/10 — but ${val}, so the price is already doing much of the work. ${weak.name} at ${fmt.score(weak.score)}/10 is the constraint on moving to a more constructive stance.`,
    NEUTRAL:`Strengths and weaknesses roughly offset: ${strong.name.toLowerCase()} at ${fmt.score(strong.score)}/10 against ${weak.name.toLowerCase()} at ${fmt.score(weak.score)}/10, with ${val}. There is no compelling asymmetry in either direction on the current data.`,
    CAUTION:`The valuation and the operating trajectory are pulling against each other — ${val}, while ${weak.name.toLowerCase()} scores ${fmt.score(weak.score)}/10. The margin for error is thin enough that the assumptions have to be exceeded rather than met.`,
    PASS:`The screened metrics do not support a position at the current price: ${val}, and ${weak.name.toLowerCase()} scores ${fmt.score(weak.score)}/10. Revisiting would require either a materially lower entry price or evidence that the operating trend has turned.`
  };
  return map[v.label];
}
function catalyst(ctx){
  const m = ctx.m, L = m.latest;
  if(m.opMarginDelta != null && m.opMarginDelta > 0) return `Continued operating leverage — margin has moved ${fmt.ptsSigned(m.opMarginDelta,1)} to ${fmt.pct(m.opMargin)}; a further step toward the model's ${fmt.pct(ctx.dcf ? ctx.dcf.assump.ebitMarginTarget : null)} terminal margin is what the valuation is discounting.`;
  if(m.revGrowth != null && m.revGrowth > 0.15) return `Evidence that growth of ${fmt.pctSigned(m.revGrowth)} is sustainable into the next fiscal year rather than decelerating on the model's assumed path.`;
  if(m.fcf != null && m.fcf > 0) return `Conversion of ${fmt.money(m.fcf)} of free cash flow into either debt reduction or shareholder returns, which would compress the equity risk the current multiple carries.`;
  return `A return to positive operating leverage — revenue growth outpacing operating cost growth for a full fiscal year.`;
}
function valuationView(ctx){
  const m = ctx.m, d = ctx.dcf;
  if(!d) return `${fmt.x(m.pe,1)} earnings and ${fmt.x(m.ptbv,2)} tangible book against a peer median of ${fmt.x(m.comps.median.pe,1)}; ROE of ${fmt.pct(m.roe)} is what has to sustain the multiple.`;
  return `Base case ${fmt.price(d.impliedPrice)} (${fmt.pctSigned(d.upside,0)}), scenario range ${fmt.price(ctx.scen.bear.result.impliedPrice)}–${fmt.price(ctx.scen.bull.result.impliedPrice)}. ${fmt.pct(d.terminalShare,0)} of value is terminal, and the company trades at ${fmt.x(m.evEbitda)} EV/EBITDA versus a ${fmt.x(m.comps.median.evEbitda)} peer median.`;
}
function changeView(ctx){
  const m = ctx.m, d = ctx.dcf;
  const parts = [];
  if(d) parts.push(`the terminal EBIT margin proving sustainable above ${fmt.pct(d.assump.ebitMarginTarget)} rather than converging back toward ${fmt.pct(m.opMargin)}`);
  if(m.growthDecel != null && m.growthDecel < 0) parts.push(`growth stabilising rather than continuing to decelerate from ${fmt.pct(m.revGrowth)}`);
  else parts.push(`growth holding near ${fmt.pct(m.revGrowth)} for another full year`);
  if(m.fcfConversion != null && m.fcfConversion < 0.8) parts.push(`cash conversion improving from ${fmt.pct(m.fcfConversion,0)} toward 100%`);
  if(m.ndEbitda != null && m.ndEbitda > 2) parts.push(`leverage falling below 2.0x EBITDA from ${fmt.x(m.ndEbitda)}`);
  return "Any of: " + parts.slice(0,3).join("; ") + ". A move of 20% in either direction in the share price without a change in the fundamentals would also change the stance, since the valuation gap is what separates WATCH from ATTRACTIVE here.";
}

function msgHTML(m){
  return `<div class="msg ${m.role === "user" ? "user" : "ai"}">
    <div class="who">${m.role === "user" ? "YOU" : "AI"}</div>
    <div class="body">${esc(m.content)}</div></div>`;
}
function chatKey(e){
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendChat(); }
}
function askQ(q){ const b = $("#chatBox"); if(b){ b.value = q; } sendChat(); }

async function sendChat(){
  if(state.chatBusy) return;
  const box = $("#chatBox"); if(!box) return;
  const q = box.value.trim(); if(!q) return;
  box.value = "";
  const log = $("#chatLog");
  if(!state.chat.length && log) log.innerHTML = "";
  state.chat.push({role:"user", content:q});
  log.insertAdjacentHTML("beforeend", msgHTML({role:"user", content:q}));
  const id = "m" + Date.now();
  log.insertAdjacentHTML("beforeend", `<div class="msg ai" id="${id}"><div class="who">AI</div><div class="body"><span class="blink"></span></div></div>`);
  log.scrollTop = log.scrollHeight;
  state.chatBusy = true; $("#sendBtn").disabled = true;
  const bodyEl = () => document.querySelector("#" + id + " .body");

  if(aiService.available()){
    try{
      const turns = state.chat.slice(0,-1).slice(-8);
      const text = await aiService.ask(state.ctx, q, turns,
        ({text}) => { const b = bodyEl(); if(b){ b.textContent = text; log.scrollTop = log.scrollHeight; } });
      state.chat.push({role:"assistant", content:text});
    }catch(e){
      const partial = e && e.text;
      const fallback = aiService.answerCompanyQuestion(state.ctx, q);
      const note = (e?.code === "not_granted" || e?.code === "sampling_disabled")
        ? "" : `\n\n[Claude was unavailable (${esc(e?.code || "error")}) — answered by the deterministic engine.]`;
      const text = (partial ? partial + "\n\n" : "") + fallback + note;
      const b = bodyEl(); if(b) b.textContent = text;
      state.chat.push({role:"assistant", content:text});
      if(e?.code === "not_granted" || e?.code === "sampling_disabled") aiService.provider = "engine";
    }
  } else {
    await sleep(220);
    const text = aiService.answerCompanyQuestion(state.ctx, q);
    const b = bodyEl(); if(b) b.textContent = text;
    state.chat.push({role:"assistant", content:text});
  }
  state.chatBusy = false;
  const sb = $("#sendBtn"); if(sb) sb.disabled = false;
  log.scrollTop = log.scrollHeight;
}

        <tr><td>(−) Capex</td>${d.rows.map(r => `<td class="v">${fmt.plain(-r.capex,0)}</td>`).join("")}</tr>
        <tr><td>(−) Δ NWC</td>${d.rows.map(r => `<td class="v">${fmt.plain(-r.dnwc,0)}</td>`).join("")}</tr>
        <tr class="total"><td><b>Unlevered FCF</b></td>${d.rows.map(r => `<td class="v"><b>${fmt.plain(r.ufcf,0)}</b></td>`).join("")}</tr>
        <tr><td>Discount factor</td>${d.rows.map(r => `<td class="v">${r.df.toFixed(3)}</td>`).join("")}</tr>
        <tr><td>PV of UFCF</td>${d.rows.map(r => `<td class="v">${fmt.plain(r.pv,0)}</td>`).join("")}</tr>
      </tbody>
    </table>
    <div class="kv">
      ${kv("PV of forecast period", fmt.money(d.pvExplicit))}
      ${kv("PV of terminal value", `${fmt.money(d.pvTerminalValue)} · ${fmt.pct(d.terminalShare,0)} of EV`)}
      ${kv("Enterprise value", fmt.money(d.enterpriseValue))}
      ${kv(d.assump.netDebt >= 0 ? "Less: net debt" : "Plus: net cash", fmt.money(Math.abs(d.assump.netDebt)))}
      ${kv("Equity value", fmt.money(d.equityValue))}
      ${kv("Diluted shares", fmt.plain(d.assump.shares,0) + "M")}
      ${kv("Implied value per share", `<b>${fmt.price(d.impliedPrice)}</b> vs. ${fmt.price(c.price)} market — <b>${fmt.pctSigned(d.upside,0)}</b>`)}
      ${kv("WACC / terminal growth", `${fmt.pct(d.assump.wacc)} / ${fmt.pct(d.assump.tgr)}`)}
      ${kv("Implied exit EV/EBITDA", fmt.x(d.impliedExitMultiple))}
    </div>
    <p>The base-case discounted cash flow model forecasts five years of unlevered free cash flow from a FY${L.fy} revenue base of ${fmt.money(L.rev)}, with growth stepping from ${fmt.pct(d.assump.growth[0])} to ${fmt.pct(d.assump.growth[4])} and the EBIT margin converging toward ${fmt.pct(d.assump.ebitMarginTarget)}. Discounting at a ${fmt.pct(d.assump.wacc)} WACC with ${fmt.pct(d.assump.tgr)} terminal growth gives ${fmt.money(d.pvExplicit)} of present value from the forecast period and ${fmt.money(d.pvTerminalValue)} from the terminal value — ${fmt.pct(d.terminalShare,0)} of an enterprise value of ${fmt.money(d.enterpriseValue)}. After net ${d.assump.netDebt >= 0 ? "debt" : "cash"} of ${fmt.money(Math.abs(d.assump.netDebt))}, equity value is ${fmt.money(d.equityValue)}, or ${fmt.price(d.impliedPrice)} per share against a market price of ${fmt.price(c.price)} — ${fmt.pctSigned(d.upside,0)}.</p>
    <p>${fmt.pct(d.terminalShare,0)} of enterprise value sits in the terminal value, so the terminal growth rate and discount rate carry most of the answer. A sensitivity grid across ±100bp of each is presented in the valuation module; the figure above is a point estimate within that range, not a price target.</p>`
    : `<p>No discounted cash flow model is run for ${esc(c.ticker)}: unlevered free cash flow is not a meaningful construct for a bank, where leverage is the business rather than a financing choice. Valuation rests on earnings power and book value — ${fmt.x(m.pe,1)} earnings against a peer median of ${fmt.x(m.comps.median.pe,1)}, ${fmt.x(m.ptbv,2)} tangible book, and return on equity of ${fmt.pct(m.roe)} against a peer median of ${fmt.pct(m.comps.median.roe)}.</p>`}

    ${d ? `<h2>Bull Case</h2><p>${esc(narrative.scenario(ctx,"bull"))}</p>
    <h2>Base Case</h2><p>${esc(narrative.scenario(ctx,"base"))}</p>
    <h2>Bear Case</h2><p>${esc(narrative.scenario(ctx,"bear"))}</p>` : ""}

    <h2>Key Risks</h2>
    <ul>${ctx.risks.map(r => `<li><b>[${r.rank}] ${esc(r.title)}.</b> ${esc(r.body)}</li>`).join("")}</ul>

    <ul>
      <li>${esc(catalyst(ctx))}</li>
      <li>Next scheduled disclosure: the ${esc(c.filings[0].type)} covering ${esc(c.filings[0].period)} and the subsequent quarterly filing, where the margin and cash-conversion trends above can be confirmed or refuted.</li>
      ${d ? `<li>Any re-rating toward or away from the peer median EV/EBITDA of ${fmt.x(m.comps.median.evEbitda)} versus the company's ${fmt.x(m.evEbitda)}.</li>` : ""}
    </ul>

    <h2>Investment Committee View</h2>
    <div class="kv">
      ${kv("Investment view", `<b>${v.label}</b>`)}
      ${kv("Primary thesis", ctx.thesis[0] ? esc(ctx.thesis[0].title) : "—")}
      ${kv("Key catalyst", esc(catalyst(ctx)))}
      ${kv("Biggest risk", esc(ctx.risks[0].title) + " [" + ctx.risks[0].rank + "]")}
      ${kv("Valuation view", esc(valuationView(ctx)))}
      ${kv("What would change our view", esc(changeView(ctx)))}
    </div>
    <p>${esc(icStatement(ctx))}</p>

    <h2>Important Metrics</h2>
    <table>
      <tbody>
        <tr><td>Revenue (FY${L.fy})</td><td class="v">${fmt.money(L.rev)}</td><td>Revenue growth</td><td class="v">${fmt.pctSigned(m.revGrowth)}</td></tr>
        <tr><td>${m.isBank?"Net margin":"EBITDA margin"}</td><td class="v">${fmt.pct(m.isBank ? m.netMargin : m.ebitdaMargin)}</td><td>${m.isBank?"ROE":"Operating margin"}</td><td class="v">${fmt.pct(m.isBank ? m.roe : m.opMargin)}</td></tr>
        <tr><td>Net income</td><td class="v">${fmt.money(L.ni)}</td><td>Diluted EPS</td><td class="v">$${(L.eps??0).toFixed(2)}</td></tr>
        ${m.isBank ? "" : `<tr><td>Free cash flow</td><td class="v">${fmt.money(m.fcf)}</td><td>FCF margin</td><td class="v">${fmt.pct(m.fcfMargin)}</td></tr>
        <tr><td>Net ${m.netDebt<0?"cash":"debt"}</td><td class="v">${fmt.money(Math.abs(m.netDebt||0))}</td><td>Net debt / EBITDA</td><td class="v">${fmt.x(m.ndEbitda)}</td></tr>
        <tr><td>ROIC</td><td class="v">${fmt.pct(m.roic)}</td><td>Current ratio</td><td class="v">${fmt.x(m.currentRatio,2)}</td></tr>`}
        <tr><td>P/E</td><td class="v">${fmt.x(m.pe,1)}</td><td>${m.isBank?"P/TBV":"EV/EBITDA"}</td><td class="v">${fmt.x(m.isBank ? m.ptbv : m.evEbitda, m.isBank?2:1)}</td></tr>
        <tr><td>FINAI score</td><td class="v">${fmt.score(sc.overall)} / 10</td><td>Committee view</td><td class="v">${v.label}</td></tr>
      </tbody>
    </table>

    <div class="disclaimer">
      <b>Important.</b> FINAI is an educational financial-analysis platform. This memo is not investment advice, not a recommendation to buy or sell any security, and not personalised to any investor's circumstances.
      The financial data used is approximate demo data assembled for a portfolio demonstration — the most recent fiscal year of each series is an estimate, figures are not audited and may not be current. Verify everything against the company's filings on EDGAR before relying on it.
      Valuation outputs are the result of a transparent model run on editable assumptions; different assumptions produce different answers, which is the point of showing the sensitivity grid rather than a single number.
      Scores are FINAI's own analytical framework for comparing companies on a consistent basis, not a rating.
    </div>
  </div>`;
}

function execSummary(ctx){
  const m = ctx.m, c = ctx.c, d = ctx.dcf, v = ctx.verdict, L = m.latest;
  return `${c.name} generated revenue of ${fmt.money(L.rev)} in FY${L.fy}, ${fmt.pctSigned(m.revGrowth)} year over year and a ${fmt.pct(m.revCagr)} compound rate over the ${m.years-1} years reviewed. `
    + (m.isBank
       ? `Net income of ${fmt.money(L.ni)} produced a ${fmt.pct(m.roe)} return on equity, with revenue split between ${fmt.money(L.nii)} of net interest income and ${fmt.money(L.nir)} of non-interest revenue. `
       : `${m.opMarginDelta != null && m.opMarginDelta > 0 ? `Operating margin expanded from ${fmt.pct(m.prior.opMargin)} to ${fmt.pct(m.opMargin)}, evidence of operating leverage` : `Operating margin was ${fmt.pct(m.opMargin)}${m.opMarginDelta != null ? `, ${fmt.ptsSigned(m.opMarginDelta,1)} versus the prior year` : ""}`}, EBITDA reached ${fmt.money(m.ebitda)} and free cash flow ${fmt.money(m.fcf)} — ${fmt.pct(m.fcfMargin)} of revenue, converting ${fmt.pct(m.fcfConversion,0)} of net income. The balance sheet carries ${fmt.money(L.cash)} of cash against ${fmt.money(L.debt)} of debt, a net ${m.netDebt < 0 ? "cash position" : "debt position"} of ${fmt.money(Math.abs(m.netDebt))}. `)
    + (d ? `The base-case DCF — five years of unlevered free cash flow discounted at ${fmt.pct(d.assump.wacc)} with ${fmt.pct(d.assump.tgr)} terminal growth — implies ${fmt.price(d.impliedPrice)} per share against ${fmt.price(c.price)}, or ${fmt.pctSigned(d.upside,0)}, with a scenario range of ${fmt.price(ctx.scen.bear.result.impliedPrice)} to ${fmt.price(ctx.scen.bull.result.impliedPrice)}. `
         : `Relative valuation at ${fmt.x(m.pe,1)} earnings against a ${fmt.x(m.comps.median.pe,1)} peer median is the framework applied here, since a free-cash-flow DCF does not fit a bank. `)
    + `FINAI's framework scores the company ${fmt.score(ctx.score.overall)} out of 10 and places it at ${v.label}. The principal risk is ${ctx.risks[0].title.toLowerCase()}.`;
}

function generateMemo(){
  const ctx = state.ctx;
  state.memoHTML = buildMemoHTML(ctx);
  state.memoTicker = ctx.c.ticker;
  const id = ctx.c.ticker + "-" + Date.now();
  state.memoId = id;
  const saved = store.saveMemo({
    id, ticker:ctx.c.ticker, name:ctx.c.name, date:new Date().toISOString(),
    verdict:ctx.verdict.label, score:ctx.score.overall, price:ctx.c.price,
    implied:ctx.dcf ? ctx.dcf.impliedPrice : null, html:state.memoHTML
  });
  render();
}
async function enhanceExec(){
  const btn = $("#execBtn"); if(!btn) return;
  btn.disabled = true; btn.textContent = "Thinking…";
  const p = $("#execP");
  try{
    const text = await aiService.enhance(state.ctx, "exec", ({text}) => { if(p) p.textContent = text; });
    state.memoHTML = buildMemoHTML(state.ctx, text);
    store.saveMemo({
      id:state.memoId, ticker:state.ctx.c.ticker, name:state.ctx.c.name, date:new Date().toISOString(),
      verdict:state.ctx.verdict.label, score:state.ctx.score.overall, price:state.ctx.c.price,
      implied:state.ctx.dcf ? state.ctx.dcf.impliedPrice : null, html:state.memoHTML
    });
    render();
  }catch(e){
    btn.disabled = false; btn.textContent = "Rewrite summary with Claude";
    if(p) p.textContent = execSummary(state.ctx);
    if(e?.code === "not_granted" || e?.code === "sampling_disabled") btn.classList.add("hide");
  }
}

function render(){
  const app = APP();
  let body = "";
  switch(state.view){
    case "home":       body = homeHTML(); break;
    case "loading":    body = loadingHTML(); break;
    case "error":      body = errorHTML(); break;
    case "company":    body = companyHTML(); break;
    case "watchlist":  body = watchlistHTML(); break;
    case "companies":  body = companiesHTML(); break;
    case "memos":      body = memosHTML(); break;
    case "memo-saved": body = savedMemoHTML(); break;
    default:           body = homeHTML();
  }
  app.innerHTML = navHTML() + body + (state.view === "loading" ? "" : footerHTML());
  mountAll();
}

function mountAll(){
  // nav search
  const ns = $("#navSearch");
  if(ns) ns.addEventListener("keydown", e => {
    if(e.key === "Enter"){
      const v = ns.value.trim().toUpperCase().replace(/[^A-Z.\-]/g, "");
      if(v && v.length <= 8){ ns.value = ""; go("#/company/" + v); }
      else { ns.value = ""; ns.placeholder = "Enter a ticker, e.g. ORCL"; }
    }
  });
  const hi = $("#heroInput");
  if(hi){ hi.addEventListener("keydown", e => { if(e.key === "Enter") submitTicker(); }); hi.focus(); }
  const cb = $("#chatBox");
  if(cb){
    cb.addEventListener("input", () => { cb.style.height = "auto"; cb.style.height = Math.min(120, cb.scrollHeight) + "px"; });
    if(state.view === "company" && state.tab === "chat") cb.focus();
    const log = $("#chatLog"); if(log) log.scrollTop = log.scrollHeight;
  }
  if(state.view !== "company" || !state.ctx) return;

  const ctx = state.ctx, m = ctx.m, c = ctx.c;
  const mm = v => fmt.money(v), pc = v => fmt.pct(v);

  if(state.tab === "overview"){
    const s = m.series, labels = s.map(y => "FY" + y.fy);
    const rev = $("#ch-rev");
    if(rev) mountChart(rev, {
      labels, height:220,
      yFmt: v => fmt.money(v, 0), y2Fmt: v => (v*100).toFixed(0) + "%",
      series:[
        {name:"Revenue", type:"bar", values:s.map(y=>y.rev), color:C.accent, fmt:mm},
        {name:"YoY growth", type:"line", axis:"right", values:s.map(y=>y.revGrowth), color:C.pos, fmt:v=>fmt.pctSigned(v)}
      ]
    });
    const fcf = $("#ch-fcf");
    if(fcf) mountChart(fcf, {
      labels, height:220, yFmt: v => fmt.money(v, 0),
      series:[{name:m.isBank?"Net income":"Free cash flow", type:"bar",
        values:s.map(y => m.isBank ? y.ni : y.fcf), color:C.accent,
        colorFn:v => v < 0 ? "var(--neg)" : "var(--accent)", fmt:mm}]
    });
  }

  if(state.tab === "financials"){
    const quarterly = state.period === "quarterly" && c.quarters;
    const rows = quarterly ? c.quarters.map((q,i,arr) => {
        const p = i >= 4 ? arr[i-4] : null;
        return Object.assign({}, q, {
          revGrowth: p ? fin.growthRate(q.rev, p.rev) : null,
          grossMargin: fin.grossMargin(q.gp, q.rev),
          opMargin: fin.operatingMargin(q.opInc, q.rev),
          netMargin: fin.netMargin(q.ni, q.rev),
          ebitda:null, fcf:null
        });
      }) : m.series;
    const labels = rows.map(r => quarterly ? String(r.fy) : "FY" + r.fy);

    const r1 = $("#fc-rev");
    if(r1) mountChart(r1, {
      labels, height:200, yFmt:v => fmt.money(v,0), y2Fmt:v => (v*100).toFixed(0)+"%",
      series:[
        {name:"Revenue", type:"bar", values:rows.map(r=>r.rev), color:C.accent, fmt:mm},
        {name:"Growth", type:"line", axis:"right", values:rows.map(r=>r.revGrowth), color:C.pos, fmt:v=>fmt.pctSigned(v)}
      ]});
    const r2 = $("#fc-mar");
    if(r2) mountChart(r2, {
      labels, height:200, yFmt:v => (v*100).toFixed(0)+"%",
      series:[
        {name:"Gross margin", type:"line", values:rows.map(r=>r.grossMargin), color:C.accent, fmt:pc},
        {name:"Operating margin", type:"line", values:rows.map(r=>r.opMargin), color:C.pos, fmt:pc},
        {name:"Net margin", type:"line", values:rows.map(r=>r.netMargin), color:C.warn, fmt:pc}
      ]});
    const r3 = $("#fc-prof");
    if(r3) mountChart(r3, {
      labels, height:200, yFmt:v => fmt.money(v,0),
      series:[
        {name:m.isBank?"Pre-tax income":"Operating income", type:"bar", values:rows.map(r=>m.isBank?r.pretax:r.opInc), color:C.accent,
         colorFn:v => v<0?"var(--neg)":"var(--accent)", fmt:mm},
        {name:"Net income", type:"bar", values:rows.map(r=>r.ni), color:C.pos,
         colorFn:v => v<0?"var(--neg)":"var(--pos)", fmt:mm}
      ]});
    const r4 = $("#fc-cash");
    if(r4) mountChart(r4, {
      labels, height:200, yFmt:v => fmt.money(v,0),
      series: m.isBank
        ? [{name:"Total assets", type:"bar", values:rows.map(r=>r.ta), color:C.accent, fmt:mm}]
        : [{name:"Operating cash flow", type:"bar", values:rows.map(r=>r.ocf), color:C.accent, colorFn:v=>v<0?"var(--neg)":"var(--accent)", fmt:mm},
           {name:"Capex", type:"bar", values:rows.map(r=>r.capex == null ? null : -r.capex), color:C.neg, fmt:mm},
           {name:"Free cash flow", type:"line", values:rows.map(r=>r.fcf), color:C.pos, fmt:mm}]
    });
  }

  if(state.tab === "valuation" && state.valTab === "dcf" && $("#w_rf")) recalcWacc();

  if(state.tab === "valuation" && state.valTab === "scen" && ctx.scen){
    const el = $("#ch-scen");
    if(el) mountChart(el, {
      labels:["Bear","Base","Bull"], height:210, yFmt:v => "$" + v.toFixed(0),
      series:[
        {name:"Implied value", type:"bar",
         values:[ctx.scen.bear.result.impliedPrice, ctx.scen.base.result.impliedPrice, ctx.scen.bull.result.impliedPrice],
         color:C.accent, colorFn:v => v < c.price ? "var(--neg)" : "var(--pos)", fmt:v=>fmt.price(v)},
        {name:"Current price", type:"line", values:[c.price, c.price, c.price], color:C.dim, dashed:true, fmt:v=>fmt.price(v)}
      ]});
  }
}

/* boot */
(async function init(){
  render();
  await route();
  // Sampling availability is resolved after first paint; the page is
  // fully usable without it, and the AI affordances appear only if it
  // resolves. Absence is a normal state, not an error.
  const ok = await aiService.init();
  if(ok && state.view === "company") render();
})();
</script>
</body>
</html>
