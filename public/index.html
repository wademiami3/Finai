/* ================================================================
   3. DATA PROVIDER (lib/api)
   ----------------------------------------------------------------
   Single seam between the app and any data source. To go live:
     - set MODE = "live"
     - implement fetchCompany() against your provider
       (SEC EDGAR companyfacts, FMP, Finnhub, Alpha Vantage)
     - map the response into the Company shape above
   Nothing else in the application changes. Keys are read from the
   environment at build time in the Next.js port; a static page never
   holds a secret, which is why the browser build is demo-only.
   ================================================================ */
const dataProvider = {
  /* "auto" is the hybrid: the ten curated companies are served from the
     verified demo dataset, and anything else is fetched live from SEC
     EDGAR through /api/company. Set to "demo" to force the offline
     build (useful for a demo recording where you want zero network
     dependency), or "live" to always hit the API. */
  MODE: "auto",                       // "auto" | "demo" | "live"
  API: "/api/company",

  listTickers(){ return Object.keys(DEMO); },
  isCurated(t){ return !!DEMO[t]; },

  /** True when a backend is actually deployed behind this page. A file
   *  opened straight from disk has none, and the app falls back to the
   *  curated set rather than showing a broken search. */
  liveAvailable(){
    return this.MODE !== "demo" && (location.protocol === "http:" || location.protocol === "https:");
  },

  /** @returns {Promise<{ok:boolean, data?:Company, error?:string, code?:string}>} */
  async fetchCompany(ticker){
    const t = String(ticker||"").trim().toUpperCase().replace(/[^A-Z.\-]/g,"");
    if(!t) return {ok:false, code:"EMPTY", error:"Enter a ticker symbol to begin."};

    if(this.MODE !== "live" && DEMO[t]){
      await sleep(90);                // provider latency, not an artificial delay
      return {ok:true, data:DEMO[t], source:"demo"};
    }
    if(this.liveAvailable()) return this.fetchLive(t);

    return {ok:false, code:"NOT_FOUND",
      error:`No coverage for "${t}". This build is running without a backend, so only the ${Object.keys(DEMO).length} curated companies are available.`};
  },

  /** Live path. The browser cannot call EDGAR directly — data.sec.gov
   *  sends no CORS headers and requires a User-Agent that browser JS is
   *  forbidden from setting — so this goes through our own function. */
  async fetchLive(ticker){
    try{
      const r = await fetch(`${this.API}?ticker=${encodeURIComponent(ticker)}`);
      // A build served without the serverless function (a bare static
      // host, or the file opened directly) returns the HTML page here
      // rather than JSON. Say that plainly instead of "network error".
      // Distinguish "the function isn't there" from "the function ran and
      // said no". A missing backend returns the HTML page, not JSON; the
      // API's own 404 for an unknown ticker IS JSON and must be passed
      // through with its real message.
      const ct = r.headers.get("content-type") || "";
      if(!ct.includes("json"))
        return {ok:false, code:"NO_BACKEND",
          error:`"${ticker}" is not one of the ${Object.keys(DEMO).length} curated companies, and this build has no data service attached — so live SEC lookup is unavailable here. Deploy with the /api/company function to search any SEC filer.`};
      const j = await r.json();
      if(!j.ok) return {ok:false, code:j.code || "FETCH_FAILED", error:j.message || "Could not load that company."};
      return {ok:true, data:j.company, source:"live"};
    }catch(e){
      return {ok:false, code:"NETWORK", error:"Could not reach the data service. Check your connection and try again."};
    }
  },

  edgarUrl(ticker, type){
    const base = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&ticker=" + encodeURIComponent(ticker);
    return type ? base + "&type=" + encodeURIComponent(type) + "&dateb=&owner=include&count=40" : base + "&owner=include&count=40";
  }
};
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ================================================================
   4. FINANCE CALCULATION ENGINE (lib/finance)
   ----------------------------------------------------------------
   Pure functions. No DOM, no model calls, no side effects.
   Every function returns null when an input is missing, so the UI
   can render "—" instead of a fabricated number.
   ================================================================ */
const fin = {
  /* --- primitives ------------------------------------------------ */
  num(v){ return (v === null || v === undefined || Number.isNaN(v)) ? null : v; },

  /** Period-over-period growth. Uses |prev| so a swing from a loss
   *  to a profit doesn't flip the sign of the growth rate. */
  growthRate(cur, prev){
    if(cur == null || prev == null || prev === 0) return null;
    return (cur - prev) / Math.abs(prev);
  },

  /** Compound annual growth rate over n periods. Undefined for a
   *  non-positive base — a CAGR off a negative number is meaningless. */
  cagr(begin, end, years){
    if(begin == null || end == null || begin <= 0 || end <= 0 || years <= 0) return null;
    return Math.pow(end / begin, 1 / years) - 1;
  },

  ratio(a, b){ if(a == null || b == null || b === 0) return null; return a / b; },
  grossMargin(gp, rev){ return fin.ratio(gp, rev); },
  operatingMargin(op, rev){ return fin.ratio(op, rev); },
  netMargin(ni, rev){ return fin.ratio(ni, rev); },

  /** EBITDA = operating income + D&A. Deliberately built from the
   *  income statement rather than taken from a vendor field, so the
   *  definition is visible and consistent across companies. */
  ebitda(opInc, da){ if(opInc == null) return null; return opInc + (da || 0); },
  ebitdaMargin(opInc, da, rev){ return fin.ratio(fin.ebitda(opInc, da), rev); },

  /** Unlevered-style FCF proxy from reported statements:
   *  operating cash flow less capital expenditures. */
  freeCashFlow(ocf, capex){ if(ocf == null) return null; return ocf - (capex || 0); },
  fcfMargin(ocf, capex, rev){ return fin.ratio(fin.freeCashFlow(ocf, capex), rev); },
  /** Cash conversion: how much of accounting profit shows up as cash. */
  fcfConversion(ocf, capex, ni){ return fin.ratio(fin.freeCashFlow(ocf, capex), ni); },

  netDebt(debt, cash){ if(debt == null && cash == null) return null; return (debt||0) - (cash||0); },
  marketCap(price, shares){ return (price == null || shares == null) ? null : price * shares; },

  /** EV = market cap + total debt − cash. Minority interest and
   *  preferred are omitted; immaterial for the covered names. */
  enterpriseValue(mktCap, debt, cash){
    if(mktCap == null) return null;
    return mktCap + (debt || 0) - (cash || 0);
  },
  evToRevenue(ev, rev){ return fin.ratio(ev, rev); },
  evToEbitda(ev, ebitda){ return (ebitda == null || ebitda <= 0) ? null : fin.ratio(ev, ebitda); },
  peRatio(price, eps){ return (price == null || eps == null || eps <= 0) ? null : price / eps; },
  fcfYield(fcf, mktCap){ return fin.ratio(fcf, mktCap); },
  netDebtToEbitda(nd, ebitda){ return (ebitda == null || ebitda <= 0) ? null : nd / ebitda; },
  currentRatio(ca, cl){ return fin.ratio(ca, cl); },
  roe(ni, eq){ return (eq == null || eq <= 0) ? null : ni / eq; },

  /** ROIC = NOPAT / invested capital, where invested capital is
   *  total debt + equity − cash (i.e. capital actually funding
   *  operations). A cash-rich balance sheet therefore raises ROIC. */
  roic(opInc, tax, debt, eq, cash){
    if(opInc == null || eq == null) return null;
    const invested = (debt || 0) + eq - (cash || 0);
    if(invested <= 0) return null;
    return (opInc * (1 - tax)) / invested;
  },

  /* --- discounting ----------------------------------------------- */
  /** Discount factor. Mid-year convention assumes cash flows arrive
   *  evenly through the year rather than all on the final day. */
  discountFactor(rate, period, midYear){
    const t = midYear ? period - 0.5 : period;
    return 1 / Math.pow(1 + rate, t);
  },
  presentValue(cashFlow, rate, period, midYear){
    if(cashFlow == null) return null;
    return cashFlow * fin.discountFactor(rate, period, midYear);
  },

  /** Gordon growth terminal value on the final forecast-year FCF.
   *  Requires WACC > g or the formula is nonsensical. */
  terminalValue(finalFcf, wacc, tgr){
    if(finalFcf == null || wacc <= tgr) return null;
    return finalFcf * (1 + tgr) / (wacc - tgr);
  },

  /** CAPM cost of equity, then a standard after-tax WACC blend. */
  costOfEquity(rf, beta, erp){ return rf + beta * erp; },
  wacc(rf, beta, erp, kd, tax, debtWeight){
    const ke = fin.costOfEquity(rf, beta, erp);
    const we = 1 - debtWeight;
    return ke * we + kd * (1 - tax) * debtWeight;
  },

  impliedSharePrice(equityValue, shares){
    return (equityValue == null || !shares) ? null : equityValue / shares;
  },
  upside(implied, current){
    if(implied == null || !current) return null;
    return implied / current - 1;
  },

  /* --- statistics ------------------------------------------------ */
  median(arr){
    const a = arr.filter(x => x != null && !Number.isNaN(x)).sort((x,y) => x - y);
    if(!a.length) return null;
    const m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2;
  },
  mean(arr){
    const a = arr.filter(x => x != null && !Number.isNaN(x));
    return a.length ? a.reduce((s,x) => s + x, 0) / a.length : null;
  },
  stdev(arr){
    const a = arr.filter(x => x != null && !Number.isNaN(x));
    if(a.length < 2) return null;
    const m = fin.mean(a);
    return Math.sqrt(a.reduce((s,x) => s + (x - m) ** 2, 0) / (a.length - 1));
  },
  premiumTo(value, benchmark){
    if(value == null || benchmark == null || benchmark === 0) return null;
    return value / benchmark - 1;
  },

  /* --- DCF -------------------------------------------------------
     Five-year unlevered free cash flow model.

       EBIT        = revenue x EBIT margin (linear ramp from the last
                     reported margin to the target margin)
       NOPAT       = EBIT x (1 − cash tax rate)
       UFCF        = NOPAT + D&A − capex − ΔNWC
       ΔNWC        = incremental revenue x working-capital intensity
       EV          = Σ PV(UFCF) + PV(terminal value)
       Equity      = EV − net debt
       Value/share = Equity ÷ diluted shares

     Returns every intermediate line so the UI can show the whole
     build rather than a single opaque output number.
  ------------------------------------------------------------------ */
  dcf(a){
    const rows = [];
    let rev = a.baseRevenue;
    let prevRev = a.baseRevenue;
    const n = a.growth.length;
    const startMargin = a.startMargin != null ? a.startMargin : a.ebitMarginTarget;

    for(let i = 0; i < n; i++){
      prevRev = rev;
      rev = rev * (1 + a.growth[i]);
      // linear glide path from the current margin to the target margin
      const margin = startMargin + (a.ebitMarginTarget - startMargin) * ((i + 1) / n);
      const ebit  = rev * margin;
      const nopat = ebit * (1 - a.tax);
      const da    = rev * a.daPct;
      const capex = rev * a.capexPct;
      const dNwc  = (rev - prevRev) * a.nwcPct;
      const ufcf  = nopat + da - capex - dNwc;
      const df    = fin.discountFactor(a.wacc, i + 1, a.midYear);
      rows.push({
        year: a.baseYear + i + 1,
        revenue: rev, growth: a.growth[i], margin,
        ebit, nopat, da, capex, dNwc, ufcf, df, pv: ufcf * df
      });
    }

    const pvExplicit = rows.reduce((s,r) => s + r.pv, 0);
    const finalFcf   = rows[rows.length - 1].ufcf;
    const tv         = fin.terminalValue(finalFcf, a.wacc, a.tgr);
    const tvDf       = fin.discountFactor(a.wacc, n, a.midYear);
    const pvTv       = tv == null ? null : tv * tvDf;
    const ev         = pvTv == null ? null : pvExplicit + pvTv;
    const equity     = ev == null ? null : ev - a.netDebt;
    const perShare   = fin.impliedSharePrice(equity, a.shares);

    return {
      rows, pvExplicit, terminalValue: tv, pvTerminalValue: pvTv,
      enterpriseValue: ev, equityValue: equity, impliedPrice: perShare,
      upside: fin.upside(perShare, a.currentPrice),
      // share of value sitting in the terminal year — a standard sanity check
      terminalShare: (ev && pvTv) ? pvTv / ev : null,
      impliedExitMultiple: (tv != null && finalFcf) ? tv / finalFcf : null,
      valid: ev != null
    };
  },

  /** WACC x terminal-growth sensitivity grid of implied share prices. */
  sensitivity(assumptions, waccs, tgrs){
    return tgrs.map(g => waccs.map(w => {
      const r = fin.dcf(Object.assign({}, assumptions, {wacc:w, tgr:g}));
      return r.impliedPrice;
    }));
  }
};

/* ================================================================
   5. FORMATTERS (lib/format)
   ================================================================ */
const fmt = {
  DASH:"—",
  money(v, dp){
    if(v == null || Number.isNaN(v)) return fmt.DASH;
    const s = v < 0 ? "-" : "", x = Math.abs(v);        // v is in millions
    const [val, unit] = x >= 1e6 ? [x/1e6, "T"] : x >= 1e3 ? [x/1e3, "B"] : x >= 1 ? [x, "M"] : [x*1000, "K"];
    // significant-figure style: fewer decimals as the number gets larger
    const d = dp != null ? dp : val >= 100 ? 0 : val >= 10 ? 1 : 2;
    return s + "$" + val.toFixed(d) + unit;
  },
  moneyFull(v){
    if(v == null) return fmt.DASH;
    const s = v < 0 ? "(" : "", e = v < 0 ? ")" : "";
    return s + "$" + Math.abs(v).toLocaleString("en-US",{maximumFractionDigits:0}) + e;
  },
  plain(v, dp){
    if(v == null || Number.isNaN(v)) return fmt.DASH;
    const s = v < 0 ? "(" : "", e = v < 0 ? ")" : "";
    return s + Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:dp ?? 0, maximumFractionDigits:dp ?? 0}) + e;
  },
  pct(v, dp){
    if(v == null || Number.isNaN(v)) return fmt.DASH;
    return (v*100).toFixed(dp ?? 1) + "%";
  },
  pctSigned(v, dp){
    if(v == null || Number.isNaN(v)) return fmt.DASH;
    return (v >= 0 ? "+" : "") + (v*100).toFixed(dp ?? 1) + "%";
  },
  /** Percentage POINTS, not percent: a margin moving from 14% to 16%
   *  moved 2 points, and writing that as "2%" is a common and costly
   *  conflation in analyst prose. */
  pts(v, dp){ return v == null || Number.isNaN(v) ? fmt.DASH : Math.abs(v*100).toFixed(dp ?? 1) + " pts"; },
  ptsSigned(v, dp){ return v == null || Number.isNaN(v) ? fmt.DASH : (v >= 0 ? "+" : "") + (v*100).toFixed(dp ?? 1) + " pts"; },
  x(v, dp){ return v == null || Number.isNaN(v) ? fmt.DASH : v.toFixed(dp ?? 1) + "x"; },
  price(v){
    if(v == null || Number.isNaN(v)) return fmt.DASH;
    // A DCF can mathematically return a negative equity value; that is not a
    // price, so it is reported as not-meaningful rather than printed as one.
    if(v <= 0 || !isFinite(v)) return "n/m";
    return "$" + v.toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
  },
  score(v){ return v == null ? fmt.DASH : v.toFixed(1); },
  cls(v){ return v == null ? "" : (v > 0 ? "pos" : v < 0 ? "neg" : ""); },
  date(iso){
    if(!iso) return fmt.DASH;
    const d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("en-US",{year:"numeric", month:"short", day:"numeric"});
  },
  today(){ return new Date().toLocaleDateString("en-US",{year:"numeric", month:"long", day:"numeric"}); }
};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
/** Split prose into sentences without breaking on abbreviations: only
 *  treat a period as terminal when it follows a lowercase letter, digit
 *  or closing bracket, so "PepsiCo is the primary U.S. distributor"
 *  stays intact. */
function sentences(str){ return String(str||"").split(/(?<=[a-z0-9)%])\.\s+(?=[A-Z])/); }
function firstSentences(str, n){
  const a = sentences(str).slice(0, n || 1).join(". ").trim();
  return /[.!?]$/.test(a) ? a : a + ".";
}

/* ================================================================
   6. ANALYSIS ENGINE (lib/finance/engine)
   ----------------------------------------------------------------
   Turns a Company into every derived figure the UI and the memo
   need. Deterministic and testable; the AI layer receives the
   OUTPUT of this engine and never recomputes any of it.
   ================================================================ */
const engine = {

  /** Enrich each reported year with margins, EBITDA and FCF. */
  buildSeries(c){
    return c.years.map((y, i) => {
      const prev = i > 0 ? c.years[i-1] : null;
      const isBank = c.type === "financial";
      return Object.assign({}, y, {
        revGrowth:  prev ? fin.growthRate(y.rev, prev.rev) : null,
        grossMargin: isBank ? null : fin.grossMargin(y.gp, y.rev),
        opMargin:    isBank ? null : fin.operatingMargin(y.opInc, y.rev),
        netMargin:   fin.netMargin(y.ni, y.rev),
        ebitda:      isBank ? null : fin.ebitda(y.opInc, y.da),
        ebitdaMargin:isBank ? null : fin.ebitdaMargin(y.opInc, y.da, y.rev),
        fcf:         isBank ? null : fin.freeCashFlow(y.ocf, y.capex),
        fcfMargin:   isBank ? null : fin.fcfMargin(y.ocf, y.capex, y.rev),
        niGrowth:   prev ? fin.growthRate(y.ni, prev.ni) : null,
        netDebt:     isBank ? null : fin.netDebt(y.debt, y.cash),
        roe:         fin.roe(y.ni, y.eq)
      });
    });
  },

  /** Headline metric set for the current period. */
  metrics(c){
    const s = engine.buildSeries(c);
    const L = s[s.length-1], P = s[s.length-2] || null;
    const isBank = c.type === "financial";
    const mktCap = fin.marketCap(c.price, c.shares);
    const ev = isBank ? null : fin.enterpriseValue(mktCap, L.debt, L.cash);
    const tax = c.dcfDefaults ? c.dcfDefaults.tax : 0.21;

    const m = {
      company:c, series:s, latest:L, prior:P, isBank,
      years: s.length,
      mktCap, ev,
      netDebt: L.netDebt,
      revenue:L.rev, revGrowth:L.revGrowth,
      revCagr: fin.cagr(s[0].rev, L.rev, s.length-1),
      ebitda:L.ebitda, ebitdaMargin:L.ebitdaMargin,
      grossMargin:L.grossMargin, opMargin:L.opMargin,
      opMarginDelta: (L.opMargin != null && P && P.opMargin != null) ? L.opMargin - P.opMargin : null,
      gmDelta: (L.grossMargin != null && P && P.grossMargin != null) ? L.grossMargin - P.grossMargin : null,
      netIncome:L.ni, eps:L.eps, netMargin:L.netMargin,
      fcf:L.fcf, fcfMargin:L.fcfMargin,
      fcfPrior: P ? P.fcf : null,
      fcfConversion: fin.fcfConversion(L.ocf, L.capex, L.ni),
      cash:L.cash, debt:L.debt,
      pe: fin.peRatio(c.price, L.eps),
      evRev: fin.evToRevenue(ev, L.rev),
      evEbitda: fin.evToEbitda(ev, L.ebitda),
      fcfYield: fin.fcfYield(L.fcf, mktCap),
      ndEbitda: isBank ? null : fin.netDebtToEbitda(L.netDebt, L.ebitda),
      currentRatio: isBank ? null : fin.currentRatio(L.ca, L.cl),
      roe: fin.roe(L.ni, L.eq),
      roic: isBank ? null : fin.roic(L.opInc, tax, L.debt, L.eq, L.cash),
      capexIntensity: isBank ? null : fin.ratio(L.capex, L.rev),
      growthVolatility: fin.stdev(s.map(y => y.revGrowth).filter(v => v != null)),
      growthDecel: (L.revGrowth != null && P && P.revGrowth != null) ? L.revGrowth - P.revGrowth : null,
      ptbv: (isBank && c.tangibleEquity) ? fin.ratio(mktCap, c.tangibleEquity) : null
    };
    m.comps = engine.comps(c, m);
    return m;
  },

  /* --- comparable companies ------------------------------------- */
  comps(c, m){
    const isBank = c.type === "financial";
    const target = isBank
      ? {ticker:c.ticker, name:c.name, mktCap:m.mktCap, growth:m.revGrowth, roe:m.roe, pe:m.pe, ptbv:m.ptbv, divYield:fin.ratio(m.latest.div, m.mktCap), isTarget:true}
      : {ticker:c.ticker, name:c.name, mktCap:m.mktCap, ev:m.ev, growth:m.revGrowth, ebitdaMargin:m.ebitdaMargin,
         pe:m.pe, evRev:m.evRev, evEbitda:m.evEbitda, fcfYield:m.fcfYield, isTarget:true};
    const rows = [target, ...c.peers.map(p => Object.assign({}, p, {isTarget:false}))];
    const peersOnly = c.peers;
    const keys = isBank ? ["growth","roe","pe","ptbv","divYield"]
                        : ["growth","ebitdaMargin","pe","evRev","evEbitda","fcfYield"];
    const median = {}, mean = {};
    keys.forEach(k => {
      median[k] = fin.median(peersOnly.map(p => p[k]));
      mean[k]   = fin.mean(peersOnly.map(p => p[k]));
    });
    const prem = {};
    keys.forEach(k => { prem[k] = fin.premiumTo(target[k], median[k]); });
    return {rows, median, mean, premium:prem, keys, isBank, target};
  },

  /* --- DCF assumption assembly ---------------------------------- */
  dcfAssumptions(c, m, override){
    if(!c.dcfDefaults) return null;
    const d = c.dcfDefaults;
    const base = {
      baseRevenue: m.latest.rev,
      baseYear: typeof m.latest.fy === "number" ? m.latest.fy : new Date().getFullYear(),
      growth: d.growth.slice(),
      startMargin: m.opMargin,
      ebitMarginTarget: d.ebitMarginTarget,
      tax: d.tax, daPct: d.daPct, capexPct: d.capexPct, nwcPct: d.nwcPct,
      wacc: d.wacc, tgr: d.tgr, midYear: true,
      netDebt: m.netDebt ?? 0,
      shares: c.shares,
      currentPrice: c.price
    };
    return Object.assign(base, override || {});
  },

  /* --- bull / base / bear ---------------------------------------
     Scenarios are expressed as assumption deltas, then valued with
     the same DCF code as the base case. Nothing is hand-waved.
  ---------------------------------------------------------------- */
  scenarios(c, m, baseAssump){
    if(!baseAssump) return null;
    /* Margin deltas are PROPORTIONAL, not absolute: a 3-point swing is
       a rounding error for a 55%-margin software business and wipes out
       a 4%-margin retailer. Scaling by the company's own margin keeps
       each scenario economically sensible across business models. */
    const mk = (label, gMult, marginMult, waccAdj, tgrAdj) => {
      const a = Object.assign({}, baseAssump, {
        growth: baseAssump.growth.map(g => Math.max(-0.03, g * gMult)),
        ebitMarginTarget: Math.max(0.005, baseAssump.ebitMarginTarget * marginMult),
        wacc: baseAssump.wacc + waccAdj,
        tgr: baseAssump.tgr + tgrAdj
      });
      const r = fin.dcf(a);
      return {label, assumptions:a, result:r};
    };
    return {
      bear: mk("Bear", 0.45, 0.78, +0.010, -0.005),
      base: mk("Base", 1.00, 1.00,  0.000,  0.000),
      bull: mk("Bull", 1.40, 1.18, -0.005, +0.005)
    };
  },

  /* --- scorecard -------------------------------------------------
     Each category maps observable metrics onto a 1–10 scale with an
     explicit, disclosed band. This is an analytical framework for
     comparing companies on a consistent basis — not a recommendation.
  ---------------------------------------------------------------- */
  scale(v, lo, hi){
    if(v == null) return null;
    return clamp(1 + 9 * (v - lo) / (hi - lo), 1, 10);
  },
  scorecard(m, dcfUpside){
    const S = engine.scale, avg = arr => {
      const a = arr.filter(x => x != null); return a.length ? a.reduce((s,x)=>s+x,0)/a.length : null;
    };
    const cats = [];
    const push = (name, score, basis, weight) => cats.push({name, score, basis, weight});

    push("Growth", avg([S(m.revGrowth, -0.05, 0.35), S(m.revCagr, 0.00, 0.30)]),
      `Latest revenue growth ${fmt.pctSigned(m.revGrowth)}; ${m.years-1}-year CAGR ${fmt.pct(m.revCagr)}.`, 0.15);

    push("Profitability", avg([S(m.ebitdaMargin ?? m.netMargin, 0.03, 0.42), S(m.opMarginDelta, -0.03, 0.05)]),
      m.isBank ? `Net margin ${fmt.pct(m.netMargin)}; ROE ${fmt.pct(m.roe)}.`
               : `EBITDA margin ${fmt.pct(m.ebitdaMargin)}; operating margin moved ${fmt.ptsSigned(m.opMarginDelta,1)} year over year.`, 0.15);

    push("Balance Sheet", m.isBank
        ? S(m.roe, 0.05, 0.18)
        : avg([S(m.ndEbitda == null ? -1 : -m.ndEbitda, -3.0, 1.0), S(m.currentRatio, 0.8, 2.5)]),
      m.isBank ? `Common equity ${fmt.money(m.latest.eq)}; ROE ${fmt.pct(m.roe)}.`
               : `Net ${m.netDebt < 0 ? "cash" : "debt"} ${fmt.money(Math.abs(m.netDebt))}${m.ndEbitda != null ? `, ${fmt.x(m.ndEbitda)} EBITDA` : ""}; current ratio ${fmt.x(m.currentRatio,2)}.`, 0.12);

    push("Cash Flow", m.isBank ? S(m.netMargin, 0.10, 0.35)
        : avg([S(m.fcfMargin, 0.00, 0.28), S(m.fcfConversion, 0.30, 1.20)]),
      m.isBank ? "Bank cash flow is not comparable to an industrial FCF measure; scored on net margin."
               : `Free cash flow ${fmt.money(m.fcf)} (${fmt.pct(m.fcfMargin)} of revenue); ${fmt.pct(m.fcfConversion,0)} of net income converted to FCF.`, 0.13);

    const valSubs = [S(dcfUpside, -0.35, 0.55)];
    if(!m.isBank && m.comps.premium.evEbitda != null) valSubs.push(S(-m.comps.premium.evEbitda, -0.45, 0.35));
    if(m.isBank && m.comps.premium.pe != null) valSubs.push(S(-m.comps.premium.pe, -0.35, 0.35));
    push("Valuation", avg(valSubs),
      dcfUpside != null ? `DCF implies ${fmt.pctSigned(dcfUpside,0)} versus the current price; trades at ${
        m.isBank ? fmt.x(m.pe,1)+" earnings" : fmt.x(m.evEbitda)+" EV/EBITDA"} against a peer median of ${
        m.isBank ? fmt.x(m.comps.median.pe,1) : fmt.x(m.comps.median.evEbitda)}.`
        : "No intrinsic-value model available for this business type; scored on relative multiples only.", 0.15);

    push("Competitive Position", avg([S(m.grossMargin ?? m.netMargin, 0.12, 0.68), S(m.roic ?? m.roe, 0.06, 0.35)]),
      m.isBank ? `ROE ${fmt.pct(m.roe)} relative to peers.`
               : `Gross margin ${fmt.pct(m.grossMargin)} and ROIC ${fmt.pct(m.roic)} are the proxies used for pricing power and returns on capital.`, 0.10);

    const riskSubs = [S(m.growthVolatility == null ? null : -m.growthVolatility, -0.60, -0.03)];
    if(m.ndEbitda != null) riskSubs.push(S(-m.ndEbitda, -3.0, 0.5));
    if(m.company.concentration) riskSubs.push(3.5);
    if(m.company.cyclical) riskSubs.push(5.0);
    push("Risk", avg(riskSubs),
      `Revenue-growth volatility of ${fmt.pct(m.growthVolatility,1)} across the reported period${m.company.concentration ? "; disclosed customer or partner concentration" : ""}${m.company.cyclical ? "; cyclical end-market exposure" : ""}. Higher score = lower assessed risk.`, 0.10);

    push("Management / Execution", avg([S(m.opMarginDelta, -0.04, 0.06), S(m.roic ?? m.roe, 0.05, 0.35), S(m.fcfConversion, 0.2, 1.1)]),
      `Judged on margin trajectory, returns on capital and cash conversion rather than qualitative commentary.`, 0.10);

    const weighted = cats.filter(c => c.score != null);
    const wsum = weighted.reduce((s,c) => s + c.weight, 0);
    const overall = wsum ? weighted.reduce((s,c) => s + c.score * c.weight, 0) / wsum : null;
    return {categories:cats, overall};
  },

  /** Committee label. Derived from the score and the valuation gap —
   *  an analytical stance, deliberately not a buy/sell instruction. */
  verdict(overall, upside){
    if(overall == null) return {label:"NEUTRAL", cls:"v-neutral"};
    if(overall >= 7.5 && (upside == null || upside > 0.10)) return {label:"ATTRACTIVE", cls:"v-attractive"};
    if(overall >= 6.5) return {label:"WATCH", cls:"v-watch"};
    if(overall >= 5.5) return {label:"NEUTRAL", cls:"v-neutral"};
    if(overall >= 4.5) return {label:"CAUTION", cls:"v-caution"};
    return {label:"PASS", cls:"v-pass"};
  },

  /* --- investment thesis ----------------------------------------
     Rule-driven: a point only appears when the underlying data
     supports it, and every point carries the figure that triggered it.
  ---------------------------------------------------------------- */
  thesis(m){
    const out = [], L = m.latest, c = m.company;
    if(m.revGrowth != null && m.revGrowth > 0.10)
      out.push({title:"Above-market revenue growth",
        body:`Revenue reached ${fmt.money(L.rev)} in ${L.fy}, growing ${fmt.pct(m.revGrowth)} year over year against a ${m.years-1}-year compound rate of ${fmt.pct(m.revCagr)}. Growth of this magnitude is the primary driver of the valuation, and the DCF is correspondingly sensitive to how quickly it decays.`,
        evidence:`${L.fy} revenue ${fmt.money(L.rev)} · YoY ${fmt.pctSigned(m.revGrowth)} · CAGR ${fmt.pct(m.revCagr)}`});
    if(m.opMarginDelta != null && m.opMarginDelta > 0.005)
      out.push({title:"Operating leverage is showing up in margins",
        body:`Operating margin expanded from ${fmt.pct(m.prior.opMargin)} to ${fmt.pct(m.opMargin)}, meaning operating income grew faster than revenue. Sustained leverage of this kind compounds directly into free cash flow.`,
        evidence:`Operating margin ${fmt.pct(m.prior.opMargin)} → ${fmt.pct(m.opMargin)} (${fmt.ptsSigned(m.opMarginDelta,1)})`});
    if(m.grossMargin != null && m.grossMargin > 0.40)
      out.push({title:"Gross margin structure supports reinvestment",
        body:`A gross margin of ${fmt.pct(m.grossMargin)} gives the company room to fund brand, R&D or distribution investment while remaining profitable — an indicator of pricing power relative to input costs.`,
        evidence:`${L.fy} gross margin ${fmt.pct(m.grossMargin)} on ${fmt.money(L.gp)} of gross profit`});
    if(m.netDebt != null && m.netDebt < 0)
      out.push({title:"Net cash balance sheet",
        body:`The company holds ${fmt.money(L.cash)} of cash against ${fmt.money(L.debt)} of debt, a net cash position of ${fmt.money(Math.abs(m.netDebt))}. That removes refinancing risk from the thesis and preserves optionality for M&A or buybacks.`,
        evidence:`Net cash ${fmt.money(Math.abs(m.netDebt))} · current ratio ${fmt.x(m.currentRatio,2)}`});
    else if(m.ndEbitda != null && m.ndEbitda < 1.5 && m.ndEbitda > 0)
      out.push({title:"Conservatively levered",
        body:`Net debt of ${fmt.money(m.netDebt)} represents ${fmt.x(m.ndEbitda)} EBITDA, comfortably inside the range where leverage is a financing decision rather than a constraint on the business.`,
        evidence:`Net debt / EBITDA ${fmt.x(m.ndEbitda)}`});
    if(m.fcf != null && m.fcfMargin > 0.10)
      out.push({title:"Cash generation funds the story",
        body:`Free cash flow of ${fmt.money(m.fcf)} equals ${fmt.pct(m.fcfMargin)} of revenue, and ${fmt.pct(m.fcfConversion,0)} of net income converted to cash. Self-funded growth means the equity story does not depend on capital markets access.`,
        evidence:`FCF ${fmt.money(m.fcf)} · FCF margin ${fmt.pct(m.fcfMargin)} · conversion ${fmt.pct(m.fcfConversion,0)}`});
    if(m.roic != null && m.roic > 0.15)
      out.push({title:"High returns on invested capital",
        body:`ROIC of ${fmt.pct(m.roic)} on invested capital of ${fmt.money((L.debt||0)+L.eq-(L.cash||0))} indicates incremental capital is being deployed well above any plausible cost of capital, which is what allows growth to create rather than consume value.`,
        evidence:`ROIC ${fmt.pct(m.roic)} vs. WACC ${fmt.pct(c.dcfDefaults ? c.dcfDefaults.wacc : null)}`});
    if(m.isBank)
      out.push({title:"Scale and funding advantage",
        body:`Net interest income of ${fmt.money(L.nii)} and non-interest revenue of ${fmt.money(L.nir)} give diversified earnings across rate environments, supported by ${fmt.money(L.deposits)} of deposits — a funding base that smaller banks cannot replicate.`,
        evidence:`Deposits ${fmt.money(L.deposits)} · ROE ${fmt.pct(m.roe)} · revenue mix ${fmt.pct(fin.ratio(L.nii,L.rev),0)} NII`});
    return out.slice(0, 5);
  },

  /* --- risks ------------------------------------------------------
     Same discipline in reverse: a risk is only listed when a metric,
     a disclosure flag or the valuation gap actually supports it.
  ---------------------------------------------------------------- */
  risks(m, dcfUpside){
    const out = [], L = m.latest, c = m.company;
    const add = (rank, title, body) => out.push({rank, title, body});

    if(m.growthDecel != null && m.growthDecel < -0.05)
      add(m.growthDecel < -0.20 ? "HIGH" : "MEDIUM", "Growth deceleration",
        `Revenue growth slowed from ${fmt.pct(m.prior.revGrowth)} to ${fmt.pct(m.revGrowth)}, a deceleration of ${fmt.pts(m.growthDecel,1)}. The DCF assumes an orderly glide path; a sharper slowdown compresses both the forecast cash flows and the multiple investors are willing to pay.`);
    if(m.opMarginDelta != null && m.opMarginDelta < -0.005)
      add(m.opMarginDelta < -0.03 ? "HIGH" : "MEDIUM", "Margin compression",
        `Operating margin fell from ${fmt.pct(m.prior.opMargin)} to ${fmt.pct(m.opMargin)}. Because terminal value is calculated off the final forecast year, a persistently lower margin has an outsized effect on intrinsic value relative to a single weak year.`);
    if(m.ndEbitda != null && m.ndEbitda > 2)
      add(m.ndEbitda > 3.5 ? "HIGH" : "MEDIUM", "Financial leverage",
        `Net debt of ${fmt.money(m.netDebt)} equals ${fmt.x(m.ndEbitda)} EBITDA. Leverage at this level limits flexibility if earnings fall and raises refinancing sensitivity to the rate environment.`);
    if(c.concentration)
      add("HIGH", "Customer / partner concentration", c.concentration + " Concentration of this kind transfers negotiating power to the counterparty and makes revenue vulnerable to a single relationship changing terms.");
    if(dcfUpside != null && dcfUpside < -0.10)
      add(dcfUpside < -0.30 ? "HIGH" : "MEDIUM", "Valuation embeds high expectations",
        `The base-case DCF implies ${fmt.price(m.dcfPrice)} against a market price of ${fmt.price(c.price)} — ${fmt.pctSigned(dcfUpside,0)}. The market is discounting outcomes better than the base case, so the assumptions have to be exceeded rather than merely met.`);
    if(!m.isBank && m.comps.premium.evEbitda != null && m.comps.premium.evEbitda > 0.20)
      add("MEDIUM", "Premium to peer multiples",
        `The company trades at ${fmt.x(m.evEbitda)} EV/EBITDA versus a peer median of ${fmt.x(m.comps.median.evEbitda)}, a ${fmt.pct(m.comps.premium.evEbitda,0)} premium. Multiple compression toward the peer group alone would be a material drawdown independent of operating results.`);
    if(m.fcfConversion != null && m.fcfConversion < 0.6 && m.fcfConversion > -5)
      add("MEDIUM", "Weak cash conversion",
        `Only ${fmt.pct(m.fcfConversion,0)} of net income converted into free cash flow. Persistent gaps between accounting profit and cash usually trace to working capital build or capitalised spend, both of which deserve scrutiny before extrapolating earnings.`);
    if(m.capexIntensity != null && m.capexIntensity > 0.12)
      add("MEDIUM", "Capital intensity",
        `Capital expenditure of ${fmt.money(L.capex)} is ${fmt.pct(m.capexIntensity)} of revenue. Heavy reinvestment can be a competitive moat, but it reduces near-term free cash flow and raises the bar for returns on incremental capital.`);
    if(m.growthVolatility != null && m.growthVolatility > 0.25)
      add("MEDIUM", "Volatile revenue history",
        `Year-over-year growth has a standard deviation of ${fmt.pct(m.growthVolatility,0)} across the reported period. A forecast built on an unstable base carries wider error bars than the point estimates in this model suggest.`);
    if(c.cyclical)
      add("MEDIUM", "End-market cyclicality",
        `Demand is exposed to a cyclical end market. Valuing a cyclical business off a peak-margin year systematically overstates intrinsic value, which is a reason to weight the bear case more heavily here.`);
    if(c.regulated)
      add("LOW", "Regulatory and policy exposure",
        `The business operates under active regulatory scrutiny in one or more major markets. Outcomes are difficult to model directly and are treated as a qualitative overlay rather than a line in the forecast.`);
    if(L.bb != null && L.bb > 0 && m.fcf != null && L.bb > m.fcf)
      add("LOW", "Buybacks exceed free cash flow",
        `Share repurchases of ${fmt.money(L.bb)} exceeded free cash flow of ${fmt.money(m.fcf)} in ${L.fy}, meaning returns to shareholders were partly funded from the balance sheet rather than from operations.`);
    if(!out.length)
      add("LOW", "No quantitative red flags in the covered metrics",
        "The screened metrics — growth trajectory, margin direction, leverage, cash conversion and relative valuation — did not trigger a risk flag. Absence of a flag is not evidence of absence of risk; qualitative and disclosure-based risks are outside this dataset.");
    const order = {HIGH:0, MEDIUM:1, LOW:2};
    return out.sort((a,b) => order[a.rank] - order[b.rank]);
  }
};

/* ================================================================
   7. AI LAYER (lib/ai)
   ----------------------------------------------------------------
   Two providers behind one interface:
     - "engine"  : deterministic narrative built from engine output.
                   Always available, instant, never invents a number.
     - "claude"  : the live model, reached through the artifact
                   runtime's sample capability, used ONLY to interpret
                   the structured figures it is handed.
   In the Next.js port the same interface is backed by
   /lib/ai/providers/{anthropic,openai}.ts behind an API route, and
   the deterministic writer stays as the offline fallback.
   ================================================================ */

/** The structured brief handed to any model. Numbers are pre-computed;
 *  the model is explicitly told not to invent or recompute them. */
function buildBrief(ctx){
  const m = ctx.m, L = m.latest, c = m.company;
  const hist = m.series.map(y => [
    `${y.fy}: revenue ${fmt.money(y.rev)}`,
    y.revGrowth != null ? `growth ${fmt.pctSigned(y.revGrowth)}` : null,
    y.grossMargin != null ? `GM ${fmt.pct(y.grossMargin)}` : null,
    y.opMargin != null ? `OM ${fmt.pct(y.opMargin)}` : null,
    y.ebitda != null ? `EBITDA ${fmt.money(y.ebitda)}` : null,
    `net income ${fmt.money(y.ni)}`,
    y.eps != null ? `EPS $${y.eps.toFixed(2)}` : null,
    y.fcf != null ? `FCF ${fmt.money(y.fcf)}` : null,
    y.cash != null ? `cash ${fmt.money(y.cash)}` : null,
    y.debt != null ? `debt ${fmt.money(y.debt)}` : null
  ].filter(Boolean).join(", ")).join("\n");

  const comps = m.comps.rows.map(r => `${r.ticker}${r.isTarget ? " (target)" : ""}: ` +
    m.comps.keys.map(k => `${k} ${k==="pe"||k==="evRev"||k==="evEbitda"||k==="ptbv" ? fmt.x(r[k]) : fmt.pct(r[k])}`).join(", ")).join("\n");

  const d = ctx.dcf;
  return [
`COMPANY: ${c.name} (${c.exchange}: ${c.ticker})`,
`Sector: ${c.sector} / ${c.industry}. Fiscal year ends ${c.fyEnd}.`,
`Business: ${c.profile}`,
`Share price used: ${fmt.price(c.price)} (demo snapshot). Diluted shares: ${fmt.plain(c.shares,0)}M. Market cap ${fmt.money(m.mktCap)}${m.ev != null ? `, enterprise value ${fmt.money(m.ev)}` : ""}.`,
``,
`HISTORICAL FINANCIALS (currency in millions, as computed by the app's finance engine):`,
hist,
``,
`CURRENT-PERIOD METRICS: revenue growth ${fmt.pctSigned(m.revGrowth)}, ${m.years-1}-yr revenue CAGR ${fmt.pct(m.revCagr)}, gross margin ${fmt.pct(m.grossMargin)}, operating margin ${fmt.pct(m.opMargin)} (${fmt.pctSigned(m.opMarginDelta,1)} pts YoY), EBITDA margin ${fmt.pct(m.ebitdaMargin)}, net margin ${fmt.pct(m.netMargin)}, FCF ${fmt.money(m.fcf)} (margin ${fmt.pct(m.fcfMargin)}, conversion ${fmt.pct(m.fcfConversion,0)}), ROIC ${fmt.pct(m.roic)}, ROE ${fmt.pct(m.roe)}, net ${m.netDebt<0?"cash":"debt"} ${fmt.money(Math.abs(m.netDebt||0))}, net debt/EBITDA ${fmt.x(m.ndEbitda)}, current ratio ${fmt.x(m.currentRatio,2)}, P/E ${fmt.x(m.pe)}, EV/Revenue ${fmt.x(m.evRev)}, EV/EBITDA ${fmt.x(m.evEbitda)}, FCF yield ${fmt.pct(m.fcfYield)}.`,
``,
`TRADING COMPARABLES (peer set defined in the app):`,
comps,
`Peer medians: ${m.comps.keys.map(k => `${k} ${k==="pe"||k==="evRev"||k==="evEbitda"||k==="ptbv" ? fmt.x(m.comps.median[k]) : fmt.pct(m.comps.median[k])}`).join(", ")}.`,
``,
d ? `DCF OUTPUT (calculated in code, not by you): WACC ${fmt.pct(d.assump.wacc)}, terminal growth ${fmt.pct(d.assump.tgr)}, 5-yr revenue growth path ${d.assump.growth.map(g=>fmt.pct(g,0)).join("/")}, target EBIT margin ${fmt.pct(d.assump.ebitMarginTarget)}. PV of forecast FCF ${fmt.money(d.pvExplicit)}, PV of terminal value ${fmt.money(d.pvTerminalValue)} (${fmt.pct(d.terminalShare,0)} of EV), enterprise value ${fmt.money(d.enterpriseValue)}, equity value ${fmt.money(d.equityValue)}, implied value per share ${fmt.price(d.impliedPrice)} versus ${fmt.price(c.price)} = ${fmt.pctSigned(d.upside,0)}. Bear ${fmt.price(ctx.scen?.bear.result.impliedPrice)} / Base ${fmt.price(ctx.scen?.base.result.impliedPrice)} / Bull ${fmt.price(ctx.scen?.bull.result.impliedPrice)}.` : `DCF: not applicable to this business type (a bank); relative valuation only.`,
``,
`SCORECARD (framework, not a recommendation): ` + ctx.score.categories.map(x => `${x.name} ${fmt.score(x.score)}`).join(", ") + `. Overall ${fmt.score(ctx.score.overall)}/10, committee stance ${ctx.verdict.label}.`,
`FLAGGED RISKS: ` + ctx.risks.map(r => `[${r.rank}] ${r.title}`).join("; ") + `.`,
``,
`DATA CAVEAT: these are approximate demo figures for a portfolio project, with the most recent year estimated. Do not present them as audited or current.`
  ].join("\n");
}

const aiService = {
  provider: "engine",          // upgraded to "claude" if the runtime grants sampling
  _sample: null,
  async init(){
    try{
      if(typeof window.claude?.use === "function"){
        const s = await window.claude.use("sample");
        if(s){ this._sample = s; this.provider = "claude"; return true; }
      }
    }catch(e){ /* absence is a normal state — stay on the deterministic writer */ }
    return false;
  },
  available(){ return this.provider === "claude" && !!this._sample; },

  /* ---- deterministic writer (always available) ------------------ */
  generateCompanySummary(ctx){ return narrative.summary(ctx); },
  generateInvestmentThesis(ctx){ return engine.thesis(ctx.m); },
  generateRisks(ctx){ return engine.risks(ctx.m, ctx.dcf ? ctx.dcf.upside : null); },
  generateScenarioExplanation(ctx, key){ return narrative.scenario(ctx, key); },
  generateInvestmentMemo(ctx){ return narrative.memo(ctx); },
  analyzeFinancialTrends(ctx){ return narrative.trends(ctx); },
  answerCompanyQuestion(ctx, q){ return narrative.answer(ctx, q); },

  /* ---- live model calls (opt-in, on an explicit click) ---------- */
  async ask(ctx, question, turns, onText, signal){
    if(!this.available()) throw {code:"not_granted", message:"no sampling"};
    const rules =
`You are FINAI's equity research analyst assistant. You are given a structured financial brief for one company, produced by a deterministic finance engine. Answer questions about THIS company only.

Rules:
- Use only the figures in the brief. Never invent, estimate or recall numbers from elsewhere. If the brief does not contain what is needed, say exactly what is missing.
- Always name the period a figure belongs to (e.g. "FY2025").
- Write like a junior-to-mid equity research analyst: 90-180 words, direct, no preamble, no bullet-point padding, no emoji.
- Explain the mechanism, not just the number: what drove it and what it implies for the investment case.
- Distinguish reported fact from model assumption. DCF outputs are the app's model, not a forecast of the market.
- Never give personalised investment advice or tell the user to buy or sell. Analysis only.
- If asked something unrelated to finance or this company, decline in one sentence and redirect.
- These are approximate demo figures; do not imply they are audited or current.

BRIEF:
${buildBrief(ctx)}`;
    const input = [{role:"user", content:rules}];
    (turns||[]).forEach(t => input.push({role:t.role, content:t.content}));
    input.push({role:"user", content:question});
    const res = await this._sample(input, {cache:false, onText, signal, modelTier:"default"});
    return res.text;
  },

  async enhance(ctx, task, onText, signal){
    if(!this.available()) throw {code:"not_granted", message:"no sampling"};
    const prompts = {
      summary:`Write the AI Analyst Summary for the company below. Return ONLY a JSON object with keys "performance","growth","profitability","position","outlook","concern". Each value is 2-3 sentences of institutional equity-research prose that cites the specific figures and periods from the brief and explains the mechanism behind them. No markdown, no preamble. Do not invent figures. "concern" states the single most important thing an investment committee should press on.

${buildBrief(ctx)}`,
      exec:`Write the Executive Summary paragraph for an investment committee memo on the company below. 130-180 words, one paragraph, institutional tone, citing specific figures and periods from the brief. State the committee stance (${ctx.verdict.label}) and what would change it. No markdown, no headings, no preamble, no invented figures.

${buildBrief(ctx)}`
    };
    if(task === "summary"){
      return await this._sample.json(prompts.summary, {signal, modelTier:"default"});
    }
    const r = await this._sample(prompts[task], {onText, signal, modelTier:"default"});
    return r.text;
  }
};

/* ================================================================
   8. DETERMINISTIC NARRATIVE WRITER
   ----------------------------------------------------------------
   Composes analyst-style prose out of engine output. Every sentence
   is templated around a computed figure, so it is specific by
   construction and cannot hallucinate.
   ================================================================ */
const narrative = {
  summary(ctx){
    const m = ctx.m, L = m.latest, P = m.prior, c = m.company, d = ctx.dcf;
    const dir = v => v == null ? "was broadly unchanged" : v > 0 ? "expanded" : "contracted";
    const out = {};

    out.performance = `${c.ticker} generated revenue of ${fmt.money(L.rev)} in ${L.fy}, ${
      m.revGrowth == null ? "with no prior-year comparison available" :
      m.revGrowth >= 0 ? `up ${fmt.pct(m.revGrowth)} year over year` : `down ${fmt.pct(Math.abs(m.revGrowth))} year over year`
    }${m.isBank ? "" : `, with net income of ${fmt.money(L.ni)} and diluted EPS of $${(L.eps??0).toFixed(2)}`}. Over the ${m.years-1} years covered, revenue compounded at ${fmt.pct(m.revCagr)}${
      m.growthVolatility != null ? `, though annual growth has varied with a standard deviation of ${fmt.pct(m.growthVolatility,0)}, so the average understates how uneven the path has been` : ""}.`;

    out.growth = m.growthDecel == null
      ? `Growth in ${L.fy} of ${fmt.pctSigned(m.revGrowth)} is the reference point for the forecast; the model steps growth down toward ${fmt.pct(ctx.dcf ? ctx.dcf.assump.growth[4] : null)} by the final forecast year.`
      : `Growth ${m.growthDecel < 0 ? "decelerated" : "accelerated"} from ${fmt.pct(P.revGrowth)} in ${P.fy} to ${fmt.pct(m.revGrowth)} in ${L.fy}, a ${fmt.pts(m.growthDecel,1)} ${m.growthDecel < 0 ? "slowdown" : "pickup"}. ${
        m.growthDecel < -0.10 ? "A deceleration of that size is the single most important input to test, because the terminal value carries most of the intrinsic value." :
        m.growthDecel > 0.10 ? "Reaccelerating growth at this scale is unusual and worth attributing to a specific driver before extrapolating it." :
        "The trajectory is consistent with an orderly normalisation rather than a break in the trend."}`;

    out.profitability = m.isBank
      ? `Net income of ${fmt.money(L.ni)} on revenue of ${fmt.money(L.rev)} is a ${fmt.pct(m.netMargin)} net margin, with return on equity of ${fmt.pct(m.roe)}. Provision expense of ${fmt.money(L.provision)} and non-interest expense of ${fmt.money(L.expense)} are the two swing factors between revenue and the bottom line.`
      : `Gross margin ${dir(m.gmDelta)} to ${fmt.pct(m.grossMargin)} and operating margin ${dir(m.opMarginDelta)}${P && P.opMargin != null ? ` from ${fmt.pct(P.opMargin)} to ${fmt.pct(m.opMargin)}` : ` to ${fmt.pct(m.opMargin)}`}${
        m.opMarginDelta != null ? ` (${fmt.ptsSigned(m.opMarginDelta,1)})` : ""}. ${
        m.opMarginDelta != null && m.gmDelta != null && m.opMarginDelta > m.gmDelta
          ? "Operating margin improved by more than gross margin, which points to operating expense leverage rather than pricing or input costs."
          : m.opMarginDelta != null && m.opMarginDelta < 0
            ? "Operating income grew more slowly than revenue, so the incremental dollar of sales is currently less profitable than the average dollar."
            : "EBITDA margin of " + fmt.pct(m.ebitdaMargin) + " is the cleaner cross-company comparison given differences in depreciation policy."}`;

    out.position = m.isBank
      ? `Total assets of ${fmt.money(L.ta)} are funded by ${fmt.money(L.deposits)} of deposits against ${fmt.money(L.eq)} of common equity. For a bank, capital adequacy and credit quality — not an enterprise-value framework — are the relevant balance-sheet lenses.`
      : `The company ended ${L.fy} with ${fmt.money(L.cash)} of cash against ${fmt.money(L.debt)} of total debt, a net ${m.netDebt < 0 ? "cash position of " + fmt.money(Math.abs(m.netDebt)) : "debt position of " + fmt.money(m.netDebt)}${
        m.ndEbitda != null ? ` (${fmt.x(m.ndEbitda)} EBITDA)` : ""}. Current ratio stands at ${fmt.x(m.currentRatio,2)}. ${
        m.netDebt < 0 ? "A net cash balance sheet removes financing risk from the thesis and leaves the equity story dependent on operations alone."
                      : m.ndEbitda > 2.5 ? "Leverage at this level is a genuine constraint: it narrows the margin for error if EBITDA falls."
                      : "Leverage is modest enough that capital structure is not a limiting factor on the investment case."}`;

    out.outlook = d
      ? `The base-case DCF discounts five years of unlevered free cash flow at a ${fmt.pct(d.assump.wacc)} WACC with ${fmt.pct(d.assump.tgr)} terminal growth, producing an implied value of ${fmt.price(d.impliedPrice)} per share versus ${fmt.price(c.price)} — ${fmt.pctSigned(d.upside,0)}. ${fmt.pct(d.terminalShare,0)} of that value sits in the terminal year, so the conclusion is far more sensitive to the durability of margins than to any single forecast year. The scenario range spans ${fmt.price(ctx.scen.bear.result.impliedPrice)} to ${fmt.price(ctx.scen.bull.result.impliedPrice)}.`
      : `A discounted free-cash-flow model is not an appropriate framework for a bank, where financing is the business rather than a funding decision. Valuation here rests on earnings power and price to tangible book: ${fmt.x(m.pe)} earnings against a peer median of ${fmt.x(m.comps.median.pe)}, with ROE of ${fmt.pct(m.roe)}.`;

    const topRisk = ctx.risks[0];
    out.concern = `${topRisk.title}. ${firstSentences(topRisk.body, 2)}`;
    return out;
  },

  trends(ctx){
    const m = ctx.m, s = m.series;
    const lines = [];
    for(let i = 1; i < s.length; i++){
      const y = s[i], p = s[i-1];
      lines.push(`${y.fy}: revenue ${fmt.money(y.rev)} (${fmt.pctSigned(y.revGrowth)})${
        y.opMargin != null && p.opMargin != null ? `, operating margin ${fmt.pct(p.opMargin)} → ${fmt.pct(y.opMargin)}` : ""}${
        y.fcf != null ? `, FCF ${fmt.money(y.fcf)}` : ""}`);
    }
    return lines;
  },

  scenario(ctx, key){
    const sc = ctx.scen[key], r = sc.result, a = sc.assumptions, m = ctx.m;
    const g = a.growth, avgG = fin.mean(g);
    const base = {
      bear:`Growth averages ${fmt.pct(avgG)} across the forecast — roughly half the base path — and the EBIT margin settles at ${fmt.pct(a.ebitMarginTarget)} as competitive pressure or cost inflation prevents the leverage assumed in the base case. A ${fmt.pct(a.wacc)} discount rate reflects the higher risk premium the market would apply in that outcome. Implied value ${fmt.price(r.impliedPrice)}, ${fmt.pctSigned(r.upside,0)} against today's price.`,
      base:`Revenue growth normalises from ${fmt.pct(g[0])} to ${fmt.pct(g[g.length-1])} over five years while the EBIT margin converges toward ${fmt.pct(a.ebitMarginTarget)} from ${fmt.pct(m.opMargin)} today, giving modest operating leverage. Discounted at ${fmt.pct(a.wacc)} with ${fmt.pct(a.tgr)} terminal growth, the model implies ${fmt.price(r.impliedPrice)} per share, ${fmt.pctSigned(r.upside,0)} versus the current price.`,
      bull:`Share gains and mix sustain growth averaging ${fmt.pct(avgG)}, and scale carries the EBIT margin to ${fmt.pct(a.ebitMarginTarget)}. Terminal growth of ${fmt.pct(a.tgr)} assumes the business is still compounding above inflation at the end of the forecast. That combination implies ${fmt.price(r.impliedPrice)} per share, ${fmt.pctSigned(r.upside,0)} from here — the outcome the market is closest to pricing if the shares already trade at a premium.`
    };
    return base[key];
  },

  /* ---- Ask the Analyst: intent routing over computed metrics ---- */
  answer(ctx, q){
    const m = ctx.m, L = m.latest, P = m.prior, c = m.company, d = ctx.dcf;
    const t = q.toLowerCase();
    const has = (...w) => w.some(x => t.includes(x));
    const cite = p => `(${p})`;

    if(!has("margin","risk","cash","growth","revenue","outlook","guidance","balance","debt","valuation","dcf","assum","bear","bull","peer","comp","compare","competitor","eps","earnings","profit","capex","invest","score","thesis","strength","weak","multiple","price","worth","fcf","free cash","leverage","liquidity","roic","return","memo","summary","business","sec","filing","10-k","quarter","segment","dividend","buyback","share","valuation")
       && t.length > 0)
      return `I'm scoped to financial analysis of ${c.ticker} — the statements, valuation model and peer set loaded in this session. Ask me about growth, margins, cash generation, the balance sheet, the DCF assumptions or the bear case and I'll answer from the ${L.fy} data.`;

    if(has("margin") && has("why","decline","fell","drop","compress","down") && !m.isBank && m.opMarginDelta != null && m.opMarginDelta < 0)
      return `Operating margin fell from ${fmt.pct(P.opMargin)} in ${P.fy} to ${fmt.pct(m.opMargin)} in ${L.fy}, a ${fmt.pts(m.opMarginDelta,1)} compression. Revenue grew ${fmt.pctSigned(m.revGrowth)} to ${fmt.money(L.rev)} while operating income moved to ${fmt.money(L.opInc)} — so costs grew faster than sales. ${
        m.gmDelta != null && m.gmDelta < -0.005
          ? `Gross margin also fell (${fmt.pct(P.grossMargin)} → ${fmt.pct(m.grossMargin)}), which points at cost of goods or mix rather than overhead.`
          : `Gross margin held at ${fmt.pct(m.grossMargin)}, so the pressure sits below the gross line — operating expense growth, not input costs or pricing.`} This dataset carries the statements but not the segment detail or management commentary that would attribute the change precisely; the 10-K MD&A is the place to confirm the driver.`;

    /* A bank has no gross or EBITDA margin; efficiency ratio and net
       interest margin are the analogous measures. */
    if(has("margin") && m.isBank)
      return `Margin in the industrial sense does not apply to ${c.ticker}. The equivalent measures for a bank are the efficiency ratio — operating expense of ${fmt.money(L.expense)} against revenue of ${fmt.money(L.rev)}, or ${fmt.pct(L.expense / L.rev)} — and the pre-tax margin of ${fmt.pct(L.pretax / L.rev)}. Net interest income was ${fmt.money(L.nii)} and non-interest income ${fmt.money(L.nir)}, so ${fmt.pct(L.nii / L.rev)} of revenue is spread-driven and the balance is fee and trading income. A lower efficiency ratio is better; the direction of provisions, ${fmt.money(L.provision)} this year, is what moves pre-tax income through a credit cycle.`;

    if(has("margin"))
      return `In ${L.fy}, gross margin was ${fmt.pct(m.grossMargin)}, operating margin ${fmt.pct(m.opMargin)} and EBITDA margin ${fmt.pct(m.ebitdaMargin)} on revenue of ${fmt.money(L.rev)}. ${
        m.opMarginDelta == null ? "" :
        m.opMarginDelta > 0 ? `Operating margin expanded ${fmt.pts(m.opMarginDelta,1)} from ${fmt.pct(P.opMargin)}, meaning operating income grew faster than revenue — operating leverage.`
                            : `Operating margin narrowed ${fmt.pts(m.opMarginDelta,1)} from ${fmt.pct(P.opMargin)}.`} For the valuation, what matters is the margin at the end of the forecast: the DCF ramps toward ${fmt.pct(d ? d.assump.ebitMarginTarget : null)}, and each point of terminal margin moves the implied value materially. ${cite(L.fy + " reported figures")}`;

    if(has("free cash","fcf","cash flow","cash generation"))
      return m.isBank
        ? `Free cash flow is not a meaningful measure for a bank and this app does not compute one for ${c.ticker}. Cash flow at a financial institution is dominated by changes in deposits, loans and trading inventory, none of which represent cash available to shareholders, and there is no capital expenditure line in the industrial sense. The equivalent questions are earnings quality and capital return: ${c.ticker} earned net income of ${fmt.money(L.ni)} in ${L.fy} on ${fmt.money(L.rev)} of revenue, returning ${fmt.money(L.div)} in dividends and ${fmt.money(L.bb)} in buybacks, against shareholders' equity of ${fmt.money(L.eq)}.`
        : `Free cash flow in ${L.fy} was ${fmt.money(m.fcf)} — operating cash flow of ${fmt.money(L.ocf)} less capital expenditure of ${fmt.money(L.capex)} — a ${fmt.pct(m.fcfMargin)} margin on revenue. ${
        m.fcfPrior != null ? `That compares with ${fmt.money(m.fcfPrior)} in ${P.fy}, a change of ${fmt.pctSigned(fin.growthRate(m.fcf, m.fcfPrior),0)}.` : ""} Conversion of net income into free cash was ${fmt.pct(m.fcfConversion,0)}. ${
        m.fcfConversion != null && m.fcfConversion < 0.7
          ? "Conversion below roughly 70% usually means working capital absorbed cash or spending was capitalised — worth reconciling against the cash flow statement before extrapolating earnings."
          : "Conversion near or above 100% means reported earnings are being backed by cash, which is what the DCF ultimately discounts."}`;

    if(has("risk","wrong","concern","worry","downside") && !has("bear case"))
      return ctx.risks.slice(0,3).map((r,i) => `${i+1}. ${r.title} [${r.rank}] — ${firstSentences(r.body)}`).join("\n") +
        `\n\nThe committee framework ranks ${ctx.risks.filter(r=>r.rank==="HIGH").length} of ${ctx.risks.length} flagged risks as high. Each is triggered by a specific metric in the ${L.fy} data rather than assumed.`;

    /* Scenarios are DCF-driven, so a bank has none. Answer the question
       that was actually asked, in the framework that applies to it. */
    if(has("bear case","bear","downside case"))
      return ctx.scen ? narrative.scenario(ctx, "bear")
        : `No DCF scenarios are built for ${c.ticker} — unlevered free cash flow is not a meaningful construct for a bank, so there is no cash-flow model to flex. The bear case for a financial institution is framed on credit and returns instead: provisions rising from ${fmt.money(L.provision)} as the cycle turns, return on equity falling from ${fmt.pct(m.roe)} toward or below the cost of equity, and the multiple of tangible book compressing from ${fmt.x(m.ptbv,2)} as a result. Book value per share is the anchor in that outcome, not a discounted cash flow.`;
    if(has("bull case","bull","upside case"))
      return ctx.scen ? narrative.scenario(ctx, "bull")
        : `The bull case for ${c.ticker} rests on returns rather than a cash flow forecast. Return on equity of ${fmt.pct(m.roe)} against a peer median of ${fmt.pct(m.comps.median.roe)} sustained through the cycle, with provisions normalising and expenses growing slower than revenue, supports a higher multiple of tangible book than the ${fmt.x(m.ptbv,2)} it trades at today. A bank earning consistently above its cost of equity should trade above book value; the argument is about whether ${fmt.pct(m.roe)} is durable.`;

    if(has("assum") || (has("valuation") && has("matter","important","sensitive")))
      return d ? `Three assumptions drive most of the outcome. First, the terminal growth rate of ${fmt.pct(d.assump.tgr)} — ${fmt.pct(d.terminalShare,0)} of enterprise value sits in the terminal year, so this single input dominates. Second, WACC of ${fmt.pct(d.assump.wacc)}; the sensitivity grid shows the implied price across ±100bps. Third, the terminal EBIT margin of ${fmt.pct(d.assump.ebitMarginTarget)} versus ${fmt.pct(m.opMargin)} today — the model assumes ${d.assump.ebitMarginTarget > m.opMargin ? "expansion" : "compression"}, and that assumption compounds through every forecast year. Revenue growth in years one and two matters less than any of these, because those cash flows are discounted least but are also the smallest share of value.`
             : `No DCF is run for a bank. The valuation rests on earnings power (${fmt.x(m.pe)} P/E versus a ${fmt.x(m.comps.median.pe)} peer median), return on equity of ${fmt.pct(m.roe)} and price to tangible book of ${fmt.x(m.ptbv,2)}.`;

    /* A bank balance sheet is deposits, loans and capital — not
       cash-versus-debt and a current ratio. */
    if(has("balance","debt","leverage","liquidity","strong","capital") && m.isBank)
      return `At the end of ${L.fy}, ${c.ticker} held ${fmt.money(L.ta)} of total assets funded by ${fmt.money(L.deposits)} of deposits, against ${fmt.money(L.loans)} of loans and ${fmt.money(L.eq)} of shareholders' equity${c.tangibleEquity ? ` (${fmt.money(c.tangibleEquity)} tangible)` : ""}. The loan-to-deposit ratio is ${fmt.x(L.loans / L.deposits, 2)} and equity is ${fmt.pct(L.eq / L.ta)} of assets — the leverage that would look alarming at an industrial company is the business model here, which is why the analysis rests on capital adequacy and asset quality rather than net debt. Return on equity of ${fmt.pct(m.roe)} is the figure that determines whether the franchise deserves a premium to book. Regulatory capital ratios are the missing piece: this dataset does not carry CET1, and no view of a bank's balance sheet is complete without it.`;

    if(has("balance","debt","leverage","liquidity","strong"))
      return `At the end of ${L.fy}: cash of ${fmt.money(L.cash)}, total debt of ${fmt.money(L.debt)}, and therefore net ${m.netDebt < 0 ? "cash" : "debt"} of ${fmt.money(Math.abs(m.netDebt))}${m.ndEbitda != null ? ` — ${fmt.x(m.ndEbitda)} EBITDA of ${fmt.money(m.ebitda)}` : ""}. Current ratio is ${fmt.x(m.currentRatio,2)} on ${fmt.money(L.ca)} of current assets against ${fmt.money(L.cl)} of current liabilities, and shareholders' equity is ${fmt.money(L.eq)}. ${
        m.netDebt < 0 ? "The strongest feature is that the company is net cash: it can fund growth, absorb a downturn or return capital without accessing debt markets."
                      : m.ndEbitda > 2.5 ? "Leverage is the constraint to watch — at this multiple a decline in EBITDA tightens covenants and refinancing terms quickly."
                      : "Leverage is moderate and does not constrain the operating plan at current EBITDA."}`;

    if(has("compar","peer","competitor","versus","vs"))
      return m.isBank
        ? `Against the peer set, ${c.ticker} trades at ${fmt.x(m.pe)} earnings versus a median of ${fmt.x(m.comps.median.pe)}, with ROE of ${fmt.pct(m.roe)} against a peer median of ${fmt.pct(m.comps.median.roe)}. Higher returns on equity generally justify a higher multiple of book, which is the crux of the relative-value argument.`
        : `On the peer set loaded here, ${c.ticker} trades at ${fmt.x(m.evEbitda)} EV/EBITDA and ${fmt.x(m.evRev)} EV/Revenue, against peer medians of ${fmt.x(m.comps.median.evEbitda)} and ${fmt.x(m.comps.median.evRev)} — a ${fmt.pctSigned(m.comps.premium.evEbitda,0)} ${m.comps.premium.evEbitda > 0 ? "premium" : "discount"} on EBITDA. Revenue growth of ${fmt.pctSigned(m.revGrowth)} compares with a peer median of ${fmt.pct(m.comps.median.growth)}, and EBITDA margin of ${fmt.pct(m.ebitdaMargin)} against ${fmt.pct(m.comps.median.ebitdaMargin)}. ${
          m.comps.premium.evEbitda > 0.15 ? "A premium is defensible when growth and margins are both above the median; it becomes a risk if either converges."
                                           : "Trading at or below the median while growing in line with it is the more defensible starting point for a long position."}`;

    if(has("growth","revenue","grow"))
      return `Revenue reached ${fmt.money(L.rev)} in ${L.fy}, ${fmt.pctSigned(m.revGrowth)} year over year, off ${fmt.money(P ? P.rev : null)} in ${P ? P.fy : "the prior year"}. Across the ${m.years-1} years in this dataset the compound rate is ${fmt.pct(m.revCagr)}. ${
        m.growthDecel != null && m.growthDecel < -0.05 ? `Growth is decelerating — ${fmt.pct(P.revGrowth)} to ${fmt.pct(m.revGrowth)} — and the forecast assumes that continues in an orderly way toward ${fmt.pct(d ? d.assump.growth[4] : null)} by year five.`
        : m.growthDecel != null && m.growthDecel > 0.05 ? `Growth accelerated from ${fmt.pct(P.revGrowth)}, which is worth attributing to a specific driver before assuming it persists.`
        : `The rate has been comparatively steady, which makes the forecast base more reliable than the volatility of the peer group would suggest.`}`;

    if(has("dcf","worth","intrinsic","fair value","target","price"))
      return d ? `The base-case DCF implies ${fmt.price(d.impliedPrice)} per share against ${fmt.price(c.price)} today — ${fmt.pctSigned(d.upside,0)}. It is built from ${fmt.money(d.pvExplicit)} of present value across five forecast years plus ${fmt.money(d.pvTerminalValue)} of discounted terminal value, giving an enterprise value of ${fmt.money(d.enterpriseValue)} and, after net ${m.netDebt<0?"cash":"debt"}, ${fmt.money(d.equityValue)} of equity value over ${fmt.plain(c.shares,0)}M shares. Every input is editable on the DCF tab, and the sensitivity grid shows the range across WACC and terminal growth. This is a model output, not a price target.`
               : `No DCF is calculated for a bank in this app, deliberately: unlevered free cash flow has no clean meaning where leverage is the business model. Relative valuation is on the Comparables tab.`;

    if(has("outlook","guidance","management","future","forecast"))
      return `This build does not carry earnings-call transcripts or management guidance — the transcript integration is architected but not connected to a licensed source, and I won't paraphrase commentary I don't have. What the numbers imply: revenue of ${fmt.money(L.rev)} growing ${fmt.pctSigned(m.revGrowth)}, ${
        m.opMarginDelta != null && m.opMarginDelta > 0 ? "margins moving in the right direction" : "margins under pressure"}, and a model that assumes growth steps down to ${fmt.pct(d ? d.assump.growth[4] : null)} with the EBIT margin reaching ${fmt.pct(d ? d.assump.ebitMarginTarget : null)}. The filings list links to EDGAR, where the MD&A and outlook language are authoritative.`;

    if(has("score","committee","thesis","memo","summary","overall"))
      return `The framework scores ${c.ticker} at ${fmt.score(ctx.score.overall)}/10 overall, stance ${ctx.verdict.label}. The components: ${ctx.score.categories.map(x => `${x.name} ${fmt.score(x.score)}`).join(", ")}. The strongest input is ${ctx.score.categories.slice().filter(x=>x.score!=null).sort((a,b)=>b.score-a.score)[0].name.toLowerCase()}; the weakest is ${ctx.score.categories.slice().filter(x=>x.score!=null).sort((a,b)=>a.score-b.score)[0].name.toLowerCase()}. This is a consistency framework for comparing companies, not a recommendation.`;

    if(has("sec","filing","10-k","10-q","8-k"))
      return `${c.filings.length} filings are listed for ${c.ticker}, most recently a ${c.filings[0].type} covering ${c.filings[0].period}. Filing metadata in demo mode is illustrative and each row links to the company's real EDGAR page. The highlights shown are derived from this app's financial dataset — they are not quotations from the filing text, and this build does not parse filing documents.`;

    return `Here is where ${c.ticker} stands on the ${L.fy} figures: revenue ${fmt.money(L.rev)} (${fmt.pctSigned(m.revGrowth)}), operating margin ${fmt.pct(m.opMargin)}, free cash flow ${fmt.money(m.fcf)}, net ${m.netDebt<0?"cash":"debt"} ${fmt.money(Math.abs(m.netDebt||0))}, and a base-case DCF value of ${fmt.price(d ? d.impliedPrice : null)} versus ${fmt.price(c.price)}. Ask me about margins, cash flow, the balance sheet, the peer set, the DCF assumptions or the bear case for more detail on any of those.`;
  },

  memo(ctx){ return ctx; }
};

/* ================================================================
   9. CHART COMPONENT (components/charts)
   ----------------------------------------------------------------
   Hand-built SVG rather than a chart library: no external runtime,
   full control of the institutional look, and tooltips that read
   like a terminal rather than a marketing site.
   ================================================================ */
function niceScale(min, max, ticks){
  ticks = ticks || 4;
  if(min === max){ min -= 1; max += 1; }
  const span = max - min;
  const step = Math.pow(10, Math.floor(Math.log10(span / ticks)));
  const err = (span / ticks) / step;
  const mult = err >= 7.5 ? 10 : err >= 3.5 ? 5 : err >= 1.5 ? 2 : 1;
  const s = step * mult;
  const lo = Math.floor(min / s) * s, hi = Math.ceil(max / s) * s;
  const out = [];
  for(let v = lo; v <= hi + s/1000; v += s) out.push(+v.toFixed(10));
  return {min:lo, max:hi, ticks:out};
}

function renderChart(host, spec){
  host._spec = spec;
  const W = Math.max(280, host.clientWidth || 560), H = spec.height || 210;
  const pad = {l:58, r:spec.series.some(s=>s.axis==="right") ? 54 : 16, t:12, b:26};
  const pw = W - pad.l - pad.r, ph = H - pad.t - pad.b;
  const labels = spec.labels, n = labels.length;

  const left  = spec.series.filter(s => s.axis !== "right");
  const right = spec.series.filter(s => s.axis === "right");
  const vals = arr => arr.flatMap(s => s.values).filter(v => v != null);
  const lv = vals(left), rv = vals(right);
  const ls = niceScale(Math.min(0, ...lv), Math.max(0, ...lv), 4);
  const rs = rv.length ? niceScale(Math.min(...rv, 0), Math.max(...rv), 4) : null;

  const x  = i => pad.l + (i + 0.5) * (pw / n);
  const yL = v => pad.t + ph - ((v - ls.min) / (ls.max - ls.min)) * ph;
  const yR = v => pad.t + ph - ((v - rs.min) / (rs.max - rs.min)) * ph;

  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" height="${H}">`;
  // gridlines + left axis
  ls.ticks.forEach(t => {
    const y = yL(t);
    svg += `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y}" y2="${y}" style="stroke:var(--grid)" stroke-width="1"/>`;
    svg += `<text x="${pad.l-9}" y="${y+3.5}" text-anchor="end" style="fill:var(--faint);font-size:10px;font-family:var(--mono)">${spec.yFmt ? spec.yFmt(t) : t}</text>`;
  });
  if(rs) rs.ticks.forEach(t => {
    svg += `<text x="${W-pad.r+9}" y="${yR(t)+3.5}" text-anchor="start" style="fill:var(--faint);font-size:10px;font-family:var(--mono)">${spec.y2Fmt ? spec.y2Fmt(t) : t}</text>`;
  });
  // zero line
  if(ls.min < 0) svg += `<line x1="${pad.l}" x2="${W-pad.r}" y1="${yL(0)}" y2="${yL(0)}" style="stroke:var(--border-2)" stroke-width="1"/>`;

  // bars
  const bars = spec.series.filter(s => s.type === "bar");
  const band = pw / n, bw = Math.min(46, (band * 0.62) / Math.max(1, bars.length));
  bars.forEach((s, si) => {
    s.values.forEach((v, i) => {
      if(v == null) return;
      const cx = x(i) - (bars.length * bw)/2 + si * bw;
      const y0 = yL(0), y1 = yL(v);
      const color = s.colorFn ? s.colorFn(v) : s.color;
      svg += `<rect x="${cx}" y="${Math.min(y0,y1)}" width="${bw-2}" height="${Math.max(1,Math.abs(y1-y0))}" rx="1.5" style="fill:${color};opacity:.9"/>`;
    });
  });
  // lines
  spec.series.filter(s => s.type === "line").forEach(s => {
    const sc = s.axis === "right" ? yR : yL;
    const pts = s.values.map((v,i) => v == null ? null : [x(i), sc(v)]).filter(Boolean);
    if(pts.length > 1)
      svg += `<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" style="stroke:${s.color}" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"${s.dashed ? ' stroke-dasharray="4 3"' : ''}/>`;
    pts.forEach(p => { svg += `<circle cx="${p[0]}" cy="${p[1]}" r="2.6" style="fill:var(--panel);stroke:${s.color}" stroke-width="1.75"/>`; });
  });
  // x labels + hover bands
  labels.forEach((l,i) => {
    svg += `<text x="${x(i)}" y="${H-7}" text-anchor="middle" style="fill:var(--dim);font-size:10.5px;font-family:var(--mono)">${esc(l)}</text>`;
    svg += `<rect class="hb" data-i="${i}" x="${pad.l + i*band}" y="${pad.t}" width="${band}" height="${ph}" fill="transparent" style="cursor:crosshair"/>`;
  });
  svg += `</svg><div class="tip"></div>`;
  host.innerHTML = svg;

  // tooltip behaviour
  const tip = host.querySelector(".tip");
  host.querySelectorAll(".hb").forEach(r => {
    r.addEventListener("mouseenter", e => {
      const i = +r.dataset.i;
      tip.innerHTML = `<div class="t">${esc(labels[i])}</div>` + spec.series.map(s => {
        const v = s.values[i];
        const f = s.fmt || (x => x);
        return `<div class="l"><span style="color:var(--dim)"><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${s.color};margin-right:6px"></i>${esc(s.name)}</span><span>${v == null ? "—" : f(v)}</span></div>`;
      }).join("");
      tip.style.opacity = 1;
      const rect = host.getBoundingClientRect();
      const px = (i + 0.5) * (rect.width / n);
      tip.style.left = Math.min(Math.max(6, px - 70), rect.width - 160) + "px";
      tip.style.top = "6px";
    });
    r.addEventListener("mouseleave", () => { tip.style.opacity = 0; });
  });
}

const store = {
  KEY_W:"finai.watchlist.v1", KEY_M:"finai.memos.v1",
  read(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  write(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  watchlist(){ return this.read(this.KEY_W, []); },
  inWatchlist(t){ return this.watchlist().includes(t); },
  toggleWatch(t){
    const w = this.watchlist(); const i = w.indexOf(t);
    if(i >= 0) w.splice(i,1); else w.push(t);
    this.write(this.KEY_W, w); return w.includes(t);
  },
  memos(){ return this.read(this.KEY_M, []); },
  saveMemo(memo){ const all = this.memos().filter(x => x.id !== memo.id); all.unshift(memo); this.write(this.KEY_M, all.slice(0,30)); },
  getMemo(id){ return this.memos().find(x => x.id === id); },
  deleteMemo(id){ this.write(this.KEY_M, this.memos().filter(x => x.id !== id)); }
};

/** Build the full analysis context for a company. One call produces
 *  every number the views, the chat and the memo use. */
function buildContext(c, override){
  const m = engine.metrics(c);
  const assump = engine.dcfAssumptions(c, m, override);
  let dcf = null, scen = null;
  if(assump){
    dcf = fin.dcf(assump);
    dcf.assump = assump;
    m.dcfPrice = dcf.impliedPrice;
    scen = engine.scenarios(c, m, assump);
  }
  const upside = dcf ? dcf.upside : null;
  const risks = engine.risks(m, upside);
  const score = engine.scorecard(m, upside);
  const verdict = engine.verdict(score.overall, upside);
  const ctx = {c, m, dcf, scen, risks, score, verdict, assump};
  ctx.thesis = engine.thesis(m);
  return ctx;
}

function go(hash){ if(location.hash === hash) render(); else location.hash = hash; }
window.addEventListener("hashchange", route);

async function route(){
  const h = (location.hash || "#/").slice(2);
  const parts = h.split("/").filter(Boolean);
  if(!parts.length){ state.view = "home"; return render(); }
  if(parts[0] === "watchlist"){ state.view = "watchlist"; return render(); }
  if(parts[0] === "memos"){ state.view = "memos"; return render(); }
  if(parts[0] === "memo" && parts[1]){ state.view = "memo-saved"; state.memoId = decodeURIComponent(parts[1]); return render(); }
  if(parts[0] === "companies"){ state.view = "companies"; return render(); }
  if(parts[0] === "company" && parts[1]){
    const t = parts[1].toUpperCase();
    if(state.ctx && state.ctx.c.ticker === t){ state.view = "company"; return render(); }
    return loadCompany(t);
  }
  state.view = "home"; render();
}

const LOAD_STEPS = [
  "Retrieving company data",
  "Analyzing financial statements",
  "Reviewing filings",
  "Building valuation model",
  "Generating investment insights"
];

async function loadCompany(ticker){
  state.view = "loading"; state.loadStep = 0; state.ticker = ticker; render();
  const res = await dataProvider.fetchCompany(ticker);
  if(!res.ok){ state.view = "error"; state.error = res; render(); return; }
  // Steps advance as real work completes; the pauses are short and
  // exist only so the sequence is legible, never to pad the wait.
  for(let i = 0; i < LOAD_STEPS.length; i++){
    state.loadStep = i; render();
    if(i === 3){
      state.dcfOverride = {};
      state.ctx = buildContext(res.data, {});
    }
    await sleep(i === 3 ? 60 : 150);
  }
  state.chat = []; state.aiSummary = null; state.aiExec = null;
  state.tab = "overview"; state.valTab = "comps"; state.stmt = "income"; state.period = "annual";
  state.view = "company"; state.ticker = res.data.ticker;
  render();
  window.scrollTo({top:0});
}

function rebuildDCF(){
  state.ctx = buildContext(state.ctx.c, state.dcfOverride);
}
