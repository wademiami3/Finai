<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FINAI — AI Investment Committee Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   FINAI — design tokens
   Dark by default; light palette available via theme selector
   and via the viewer's own light preference.
   ============================================================ */
:root{
  --bg:#0A0C0F; --bg-2:#0E1116; --panel:#101419; --panel-2:#141922;
  --border:#1B212A; --border-2:#28313D;
  --text:#E9EDF2; --dim:#96A0AE; --faint:#616C7A;
  --pos:#3FB98C; --pos-bg:rgba(63,185,140,.10);
  --neg:#E06B75; --neg-bg:rgba(224,107,117,.10);
  --accent:#5B8DEF; --accent-2:#2B3F63; --accent-bg:rgba(91,141,239,.10);
  --warn:#D9A441; --warn-bg:rgba(217,164,65,.10);
  --grid:#1A2029;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.18);
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F7F8FA; --bg-2:#FFFFFF; --panel:#FFFFFF; --panel-2:#F2F4F7;
    --border:#E3E7EC; --border-2:#CBD2DB;
    --text:#111820; --dim:#5A6674; --faint:#8A94A1;
    --pos:#1F8A62; --pos-bg:rgba(31,138,98,.09);
    --neg:#C2414C; --neg-bg:rgba(194,65,76,.09);
    --accent:#2F63C8; --accent-2:#C9D8F5; --accent-bg:rgba(47,99,200,.08);
    --warn:#9A6B12; --warn-bg:rgba(154,107,18,.10);
    --grid:#E8ECF1;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  }
}
:root[data-theme="light"]{
  --bg:#F7F8FA; --bg-2:#FFFFFF; --panel:#FFFFFF; --panel-2:#F2F4F7;
  --border:#E3E7EC; --border-2:#CBD2DB;
  --text:#111820; --dim:#5A6674; --faint:#8A94A1;
  --pos:#1F8A62; --pos-bg:rgba(31,138,98,.09);
  --neg:#C2414C; --neg-bg:rgba(194,65,76,.09);
  --accent:#2F63C8; --accent-2:#C9D8F5; --accent-bg:rgba(47,99,200,.08);
  --warn:#9A6B12; --warn-bg:rgba(154,107,18,.10);
  --grid:#E8ECF1;
  --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
}
:root[data-theme="dark"]{
  --bg:#0A0C0F; --bg-2:#0E1116; --panel:#101419; --panel-2:#141922;
  --border:#1B212A; --border-2:#28313D;
  --text:#E9EDF2; --dim:#96A0AE; --faint:#616C7A;
  --grid:#1A2029;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select{font-family:inherit;font-size:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.pos{color:var(--pos)} .neg{color:var(--neg)} .dim{color:var(--dim)} .faint{color:var(--faint)}
.hide{display:none !important}

/* ---------- layout ---------- */
.wrap{max-width:1400px;margin:0 auto;padding:0 28px}
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}.gap24{gap:24px}
.grow{flex:1}

/* ---------- nav ---------- */
header.nav{
  position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(140%) blur(10px); border-bottom:1px solid var(--border);
}
.nav-inner{height:58px;display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.logo-mark{width:20px;height:20px;border-radius:4px;background:linear-gradient(150deg,var(--accent),#7FB2FF);
  position:relative;flex:none}
.logo-mark:after{content:"";position:absolute;inset:5px 5px auto auto;width:6px;height:6px;border-radius:1px;background:var(--bg)}
.logo-text{font-weight:700;letter-spacing:.16em;font-size:14px}
.nav-links{display:flex;gap:2px}
.nav-links a{padding:7px 11px;border-radius:var(--r);color:var(--dim);font-size:13px;font-weight:500;transition:color .15s,background .15s}
.nav-links a:hover{color:var(--text);background:var(--panel-2)}
.nav-links a.active{color:var(--text);background:var(--panel-2)}
.nav-search{position:relative;width:210px}
.nav-search input{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);
  padding:7px 10px 7px 30px;font-size:12.5px;outline:none;transition:border-color .15s}
.nav-search input:focus{border-color:var(--border-2)}
.nav-search svg{position:absolute;left:9px;top:8px;opacity:.5}
.badge{font-size:9.5px;letter-spacing:.11em;font-weight:600;text-transform:uppercase;
  padding:3px 7px;border-radius:3px;border:1px solid var(--border-2);color:var(--dim);white-space:nowrap}
.badge.demo{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-bg)}
.badge.live{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.badge.live{color:var(--pos);border-color:color-mix(in srgb,var(--pos) 40%,transparent);background:var(--pos-bg)}
.icon-btn{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--border);
  background:var(--panel);border-radius:var(--r);color:var(--dim);transition:.15s}
.icon-btn:hover{color:var(--text);border-color:var(--border-2)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--panel-2);border:1px solid var(--border-2);
  display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--dim)}

/* ---------- hero ---------- */
.hero{padding:96px 0 40px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;top:-260px;left:50%;transform:translateX(-50%);
  width:900px;height:520px;background:radial-gradient(ellipse at center,var(--accent-bg),transparent 66%);pointer-events:none}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--panel);
  padding:5px 11px;border-radius:100px;font-size:11.5px;color:var(--dim);margin-bottom:26px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--pos)}
h1.hero-title{font-size:66px;line-height:1.02;letter-spacing:-.035em;margin:0 0 18px;font-weight:700}
.hero-sub{font-size:17px;color:var(--dim);max-width:620px;margin:0 0 8px;line-height:1.55}
.hero-kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:14px}

.searchbar{display:flex;gap:10px;max-width:640px;margin:34px 0 14px}
.searchbar .field{flex:1;position:relative}
.searchbar input{width:100%;background:var(--panel);border:1px solid var(--border-2);border-radius:var(--r);
  padding:15px 16px;font-size:15px;font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;outline:none;transition:.15s}
.searchbar input::placeholder{letter-spacing:.02em;text-transform:none;font-family:var(--sans);color:var(--faint)}
.searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.btn{border:1px solid var(--border-2);background:var(--panel);border-radius:var(--r);padding:9px 14px;
  font-size:13px;font-weight:500;transition:.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--dim)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.lg{padding:15px 22px;font-size:14px}
.btn.sm{padding:5px 10px;font-size:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--border);background:var(--panel);border-radius:100px;padding:5px 12px;
  font-size:12px;font-family:var(--mono);color:var(--dim);transition:.15s}
.chip:hover{color:var(--text);border-color:var(--border-2);background:var(--panel-2)}

.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:var(--r);margin:64px 0 20px;overflow:hidden}
.flow-step{background:var(--panel);padding:22px 20px}
.flow-step .n{font-family:var(--mono);font-size:11px;color:var(--accent);margin-bottom:12px}
.flow-step h4{margin:0 0 6px;font-size:14px;font-weight:600}
.flow-step p{margin:0;font-size:12.5px;color:var(--dim);line-height:1.5}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0 90px}

/* ---------- panels / sections ---------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r)}
.panel-pad{padding:20px}
.section{margin:34px 0}
.section-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
.section-title{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--text)}
.section-rule{flex:1;height:1px;background:var(--border)}
.section-note{font-size:11.5px;color:var(--faint)}
.subtle-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600}

/* ---------- company header ---------- */
.co-head{border-bottom:1px solid var(--border);padding:26px 0 20px;background:var(--bg-2)}
.co-name{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0}
.co-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:7px;font-size:12.5px;color:var(--dim)}
.co-tick{font-family:var(--mono);font-size:12.5px;color:var(--text);letter-spacing:.04em}
.sep{width:1px;height:11px;background:var(--border-2)}
.price-block{text-align:right}
.price-val{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em}
.price-chg{font-family:var(--mono);font-size:12.5px;margin-top:3px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:11px 14px;font-size:13px;color:var(--dim);border-bottom:2px solid transparent;
  margin-bottom:-1px;font-weight:500;white-space:nowrap;transition:.15s;background:none;border-top:0;border-left:0;border-right:0}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.pill-tabs{display:inline-flex;gap:2px;padding:3px;background:var(--panel-2);border:1px solid var(--border);border-radius:var(--r)}
.pill{padding:5px 12px;font-size:12px;border-radius:4px;color:var(--dim);border:0;background:none;transition:.15s}
.pill.active{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.pill:disabled{opacity:.4;cursor:not-allowed}

/* ---------- KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--panel);padding:15px 16px;min-height:86px}
.kpi .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.kpi .v{font-family:var(--mono);font-size:19px;margin-top:9px;letter-spacing:-.02em;font-weight:500}
.kpi .s{font-size:11.5px;margin-top:5px;color:var(--dim);font-family:var(--mono)}

/* ---------- tables ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:9px 14px;text-align:right;white-space:nowrap}
th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;
  border-bottom:1px solid var(--border);background:var(--panel-2);position:sticky;top:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
th:first-child{background:var(--panel-2);z-index:2}
tbody tr{border-bottom:1px solid var(--border)}
tbody tr:last-child{border-bottom:0}
tbody tr:hover td{background:var(--panel-2)}
tbody tr:hover td:first-child{background:var(--panel-2)}
td.v{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.total td{font-weight:600;border-top:1px solid var(--border-2);background:var(--panel-2)}
tr.total td:first-child{background:var(--panel-2)}
tr.hl td{background:var(--panel-2);border-bottom:1px solid var(--border-2)}
tr.hl td:first-child{background:var(--panel-2)}
tr.sub td:first-child{padding-left:26px;color:var(--dim)}
tr.spacer td{height:6px;padding:0;border:0;background:var(--panel)}
.rowlabel{color:var(--text)}
.rowlabel.muted{color:var(--dim);font-weight:400}
.highlight-row td{background:var(--accent-bg) !important;border-top:1px solid var(--accent-2);border-bottom:1px solid var(--accent-2)}
.highlight-row td:first-child{background:var(--accent-bg) !important;font-weight:600}

/* ---------- charts ---------- */
.chart-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px 16px 8px}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.chart-title{font-size:13px;font-weight:600}
.chart-sub{font-size:11.5px;color:var(--faint)}
.chart-host{position:relative;width:100%}
.chart-host svg{display:block;width:100%;overflow:visible}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);padding:2px 0 8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--bg-2);border:1px solid var(--border-2);
  border-radius:5px;padding:8px 10px;font-size:11.5px;box-shadow:var(--shadow);z-index:20;min-width:140px;opacity:0;transition:opacity .1s}
.tip .t{font-weight:600;margin-bottom:5px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.tip .l{display:flex;justify-content:space-between;gap:16px;font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}

/* ---------- analyst blocks ---------- */
.an-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);
  border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.an-block{background:var(--panel);padding:18px}
.an-block h5{margin:0 0 9px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.an-block p{margin:0;font-size:13px;line-height:1.65;color:var(--text)}
.an-block.warn h5{color:var(--warn)}

/* ---------- lists ---------- */
.thesis{display:flex;gap:14px;padding:16px 18px;border-bottom:1px solid var(--border)}
.thesis:last-child{border-bottom:0}
.thesis .idx{font-family:var(--mono);font-size:11px;color:var(--accent);padding-top:2px;width:18px;flex:none}
.thesis h4{margin:0 0 5px;font-size:13.5px;font-weight:600}
.thesis p{margin:0 0 7px;font-size:12.5px;color:var(--dim);line-height:1.6}
.evidence{font-family:var(--mono);font-size:11.5px;color:var(--text);background:var(--panel-2);
  border-left:2px solid var(--accent);padding:6px 10px;border-radius:0 3px 3px 0;display:inline-block}
.risk{display:flex;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border);align-items:flex-start}
.risk:last-child{border-bottom:0}
.rank{font-size:9.5px;letter-spacing:.1em;font-weight:700;padding:3px 7px;border-radius:3px;width:60px;text-align:center;flex:none;margin-top:1px}
.rank.high{color:var(--neg);background:var(--neg-bg);border:1px solid color-mix(in srgb,var(--neg) 35%,transparent)}
.rank.medium{color:var(--warn);background:var(--warn-bg);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.rank.low{color:var(--dim);background:var(--panel-2);border:1px solid var(--border-2)}

/* ---------- scorecard ---------- */
.score-row{display:grid;grid-template-columns:150px 1fr 44px;align-items:center;gap:14px;padding:9px 0}
.bar{height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.score-val{font-family:var(--mono);font-size:12.5px;text-align:right}
.overall{display:flex;align-items:baseline;gap:10px}
.overall .big{font-family:var(--mono);font-size:46px;font-weight:600;letter-spacing:-.03em}
.verdict{display:inline-block;padding:6px 14px;border-radius:4px;font-size:13px;font-weight:700;letter-spacing:.1em}
.v-attractive{color:var(--pos);background:var(--pos-bg);border:1px solid color-mix(in srgb,var(--pos) 40%,transparent)}
.v-watch{color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-2)}
.v-neutral{color:var(--dim);background:var(--panel-2);border:1px solid var(--border-2)}
.v-caution,.v-pass{color:var(--neg);background:var(--neg-bg);border:1px solid color-mix(in srgb,var(--neg) 40%,transparent)}

/* ---------- DCF ---------- */
.dcf-layout{display:grid;grid-template-columns:290px 1fr;gap:14px;align-items:start}
.assump{padding:16px}
.assump h4{margin:0 0 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.field-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px}
.field-row label{font-size:12.5px;color:var(--dim)}
.inp{width:78px;background:var(--bg-2);border:1px solid var(--border);border-radius:4px;padding:5px 8px;
  font-family:var(--mono);font-size:12px;text-align:right;outline:none;transition:.15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.inp.sm{width:62px}
.divider{height:1px;background:var(--border);margin:14px 0}
.out-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.out{background:var(--panel);padding:16px}
.out .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.out .v{font-family:var(--mono);font-size:24px;margin-top:8px;font-weight:500;letter-spacing:-.02em}
.sens td.c{font-family:var(--mono);text-align:center}
.sens th{text-align:center}
.heat{border-radius:2px;padding:6px 2px;display:block}
details.wacc summary{cursor:pointer;font-size:11.5px;color:var(--accent);list-style:none;padding:2px 0}
details.wacc summary::-webkit-details-marker{display:none}

/* ---------- scenarios ---------- */
.scen{padding:18px;border-radius:var(--r);border:1px solid var(--border);background:var(--panel)}
.scen h4{margin:0 0 3px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.scen .val{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.025em;margin:10px 0 2px}
.scen .up{font-family:var(--mono);font-size:12.5px}
.scen p{font-size:12.5px;color:var(--dim);line-height:1.6;margin:12px 0 0}
.scen-assump{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:11.5px;color:var(--faint);font-family:var(--mono);line-height:1.7}
.scen.bear{border-top:2px solid var(--neg)} .scen.bear h4{color:var(--neg)}
.scen.base{border-top:2px solid var(--accent)} .scen.base h4{color:var(--accent)}
.scen.bull{border-top:2px solid var(--pos)} .scen.bull h4{color:var(--pos)}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;height:560px}
.chat-log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.msg{display:flex;gap:12px;max-width:820px}
.msg .who{width:26px;height:26px;border-radius:4px;flex:none;display:grid;place-items:center;
  font-size:9.5px;font-weight:700;letter-spacing:.04em}
.msg.user .who{background:var(--panel-2);border:1px solid var(--border-2);color:var(--dim)}
.msg.ai .who{background:var(--accent-bg);border:1px solid var(--accent-2);color:var(--accent)}
.msg .body{font-size:13px;line-height:1.68;padding-top:3px;white-space:pre-wrap}
.msg .body b{font-weight:600}
.chat-input{border-top:1px solid var(--border);padding:12px 14px;display:flex;gap:10px;align-items:flex-end}
.chat-input textarea{flex:1;background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r);
  padding:10px 12px;font-size:13px;resize:none;outline:none;min-height:40px;max-height:120px;line-height:1.5}
.chat-input textarea:focus{border-color:var(--border-2)}
.sugg{display:flex;gap:7px;flex-wrap:wrap;padding:0 14px 12px}
.blink{display:inline-block;width:7px;height:13px;background:var(--accent);vertical-align:-2px;animation:bk 1s steps(2) infinite}
@keyframes bk{0%,50%{opacity:1}51%,100%{opacity:0}}

/* ---------- filings ---------- */
.filing{display:grid;grid-template-columns:70px 1fr 110px 120px 90px;gap:14px;align-items:center;
  padding:11px 16px;border-bottom:1px solid var(--border);font-size:12.5px}
.filing:last-child{border-bottom:0}
.ftype{font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 7px;border-radius:3px;
  border:1px solid var(--border-2);text-align:center;color:var(--dim)}
.ftype.k{color:var(--accent);border-color:var(--accent-2);background:var(--accent-bg)}

/* ---------- loading ---------- */
.loading{min-height:64vh;display:grid;place-items:center}
.load-card{width:440px}
.load-step{display:flex;gap:12px;align-items:center;padding:9px 0;font-size:13px;color:var(--faint);transition:color .3s}
.load-step.done{color:var(--dim)} .load-step.active{color:var(--text)}
.tickmark{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--border-2);flex:none;display:grid;place-items:center}
.load-step.done .tickmark{border-color:var(--pos);background:var(--pos-bg)}
.load-step.active .tickmark{border-color:var(--accent);border-top-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress{height:2px;background:var(--panel-2);border-radius:2px;overflow:hidden;margin-top:18px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s ease}

/* ---------- memo ---------- */
.memo{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:52px 60px;max-width:920px;margin:0 auto}
.memo h1{font-size:19px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 4px;font-weight:700}
.memo .memo-sub{font-size:12px;color:var(--dim);font-family:var(--mono)}
.memo hr{border:0;border-top:1px solid var(--border);margin:22px 0}
.memo h2{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:26px 0 10px;font-weight:600}
.memo p{font-size:13.5px;line-height:1.75;margin:0 0 11px}
.memo ul{margin:0 0 11px;padding-left:18px}
.memo li{font-size:13.5px;line-height:1.75;margin-bottom:6px}
.memo table{font-size:12.5px;margin:6px 0 4px}
.memo .kv{display:grid;grid-template-columns:170px 1fr;gap:6px 16px;font-size:13px;margin:10px 0}
.memo .kv .k{color:var(--dim)}
.principle{display:inline-flex;align-items:center;gap:12px;margin:18px 0 26px;padding:9px 18px;border:1px solid var(--border-2);border-radius:999px;background:var(--panel-2)}
.principle span{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);font-weight:600}
.principle i{color:var(--accent);font-style:normal;font-size:11px}
.disclaimer{font-size:11.5px;color:var(--faint);line-height:1.6;border-top:1px solid var(--border);padding-top:14px;margin-top:26px}

/* ---------- misc ---------- */
.empty{padding:48px;text-align:center;color:var(--dim);font-size:13.5px}
.alert{display:flex;gap:11px;padding:13px 15px;border-radius:var(--r);font-size:12.5px;line-height:1.6;
  border:1px solid var(--border-2);background:var(--panel-2);color:var(--dim)}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:var(--warn-bg)}
.alert b{color:var(--text)}
.fade-in{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.footer{border-top:1px solid var(--border);margin-top:70px;padding:26px 0 44px;font-size:11.5px;color:var(--faint);line-height:1.7}

@media (max-width:1180px){
  .kpi-grid{grid-template-columns:repeat(4,1fr)}
  .dcf-layout{grid-template-columns:1fr}
  .grid4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px){
  .wrap{padding:0 16px}
  h1.hero-title{font-size:42px}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .grid2,.grid3,.an-grid,.flow,.feat{grid-template-columns:1fr}
  .nav-links,.nav-search{display:none}
  .searchbar{flex-direction:column}
  .memo{padding:26px 20px}
  .filing{grid-template-columns:64px 1fr;row-gap:6px}
}

@media print{
  header.nav,.no-print{display:none !important}
  body{background:#fff;color:#000}
  .memo{border:0;padding:0;max-width:none}
  .memo h2{color:#333}
  .memo table th,.memo table td{border-bottom:1px solid #ddd}
}
